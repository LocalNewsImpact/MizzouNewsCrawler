apiVersion: v1
kind: Pod
metadata:
  name: hostcap-chrome-capture-keep
  namespace: production
spec:
  hostNetwork: true
  nodeName: gke-mizzou-cluster-standard-pool-d9a48e54-w8vp
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: tcpdump
      image: nicolaka/netshoot:latest
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "Starting 20s tcpdump for chrome handshake to 34.145.9.240:443"
          timeout 20 tcpdump -i any -s0 -w /tmp/hostcap.pcap tcp and host 34.145.9.240 and port 443 || true
          echo "Capture done, keeping pod alive for 60s to allow cp"
          ls -l /tmp/hostcap.pcap || true
          sleep 60
          echo "Exiting after sleep"
      securityContext:
        capabilities:
          add: ["NET_ADMIN", "NET_RAW"]
