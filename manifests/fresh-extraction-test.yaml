apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fresh-extract-test-
  namespace: production
  labels:
    type: extraction-quality-test
spec:
  serviceAccountName: argo-workflow
  entrypoint: main
  ttlStrategy:
    secondsAfterCompletion: 86400
  tolerations:
    - key: cloud.google.com/gke-spot
      operator: Equal
      value: "true"
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: cloud.google.com/gke-spot
                operator: In
                values: ["true"]

  # Common env shared by every step (DB via Cloud SQL connector + Squid proxy).
  # Defined once via a YAML anchor; resolved at submit time.
  arguments:
    parameters: []

  templates:
    - name: main
      steps:
        - - name: proxy-preflight      # fail fast if the proxy is down
            template: proxy-preflight
        - - name: discover
            template: discover
        - - name: verify
            template: verify
        - - name: extract
            template: extract

    - name: proxy-preflight
      metadata:
        labels: {stage: preflight, test: traf-quality}
      container:
        image: &img us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/crawler:c843a31
        # Always: SHA tags here are mutable in practice — a rebuild of the same
        # commit re-pushes the tag to a new digest. With IfNotPresent a node
        # serves whatever it cached first, which silently ran a stale image
        # through a whole test on 2026-07-20.
        imagePullPolicy: Always
        command: ["python", "-c"]
        args:
          - |
            import os, sys, urllib.request, time
            p = os.environ["SQUID_PROXY_URL"]
            t = time.time()
            try:
                op = urllib.request.build_opener(
                    urllib.request.ProxyHandler({"http": p, "https": p}))
                r = op.open("https://www.ksdk.com/", timeout=20)
                assert r.status == 200, f"status {r.status}"
                print(f"✅ proxy healthy: 200 via Squid in {time.time()-t:.1f}s")
            except Exception as e:
                print(f"❌ proxy preflight FAILED: {type(e).__name__}: {e}")
                print("Aborting before wasting a full crawl on a dead proxy.")
                sys.exit(1)
        env:
          - {name: PROXY_PROVIDER, value: "squid"}
          - name: SQUID_PROXY_URL
            valueFrom: {secretKeyRef: {name: squid-proxy-credentials, key: squid-proxy-url}}
          - {name: NO_PROXY, value: "localhost,127.0.0.1,metadata.google.internal"}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}

    - name: discover
      metadata:
        labels: {stage: discovery, test: traf-quality}
      container:
        image: *img
        # Always: SHA tags here are mutable in practice — a rebuild of the same
        # commit re-pushes the tag to a new digest. With IfNotPresent a node
        # serves whatever it cached first, which silently ran a stale image
        # through a whole test on 2026-07-20.
        imagePullPolicy: Always
        command:
          - python
          - -m
          - src.cli.cli_modular
          - discover-urls
          - --source-uuids
          - c5c77eac-924e-4583-b7c2-dd6134878c52
          - cd80cd2f-310c-4a3a-b39b-d5a3ca8156d8
          - 50723f6a-9882-4d5f-9cdc-f4e63635fe43
          - 46b3f1d7-cbea-4db4-8ffd-402aaa00965d
          - 8902e556-72cb-45f4-9ad2-e7c822b6615f
          - 7c876152-199a-48c8-adb5-87581dd681cb
          - ad3a9b80-85e6-4551-a57a-a0dbe4dbbd10
          - a90df733-d885-459b-b841-3d00f4b5537a
          - 009f8695-a4d1-4732-bcfc-f74efba1b6bb
          - 220512f6-7aee-426e-9ee8-95a23e79cedf
          - --max-articles
          - "3"
          - --force-all
          - --days-back
          - "30"
          - --log-level
          - INFO
        env: &dbproxy
          - {name: DATABASE_ENGINE, value: "postgresql+psycopg2"}
          - {name: DATABASE_HOST, value: "127.0.0.1"}
          - {name: DATABASE_PORT, value: "5432"}
          - name: DATABASE_USER
            valueFrom: {secretKeyRef: {name: cloudsql-db-credentials, key: username}}
          - name: DATABASE_PASSWORD
            valueFrom: {secretKeyRef: {name: cloudsql-db-credentials, key: password}}
          - name: DATABASE_NAME
            valueFrom: {secretKeyRef: {name: cloudsql-db-credentials, key: database}}
          - {name: DATABASE_URL, value: "$(DATABASE_ENGINE)://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"}
          - {name: TELEMETRY_DATABASE_URL, value: "$(DATABASE_ENGINE)://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"}
          - {name: USE_CLOUD_SQL_CONNECTOR, value: "true"}
          - {name: CLOUD_SQL_INSTANCE, value: "mizzou-news-crawler:us-central1:mizzou-db-prod-ssd"}
          - {name: PROXY_PROVIDER, value: "squid"}
          - name: SQUID_PROXY_URL
            valueFrom: {secretKeyRef: {name: squid-proxy-credentials, key: squid-proxy-url}}
          - {name: GOOGLE_CLOUD_PROJECT, value: "mizzou-news-crawler"}
          - {name: NO_PROXY, value: "localhost,127.0.0.1,metadata.google.internal,huggingface.co,*.huggingface.co"}
        resources:
          requests: {cpu: 200m, memory: 2Gi}
          limits: {cpu: 1000m, memory: 4Gi}

    - name: verify
      metadata:
        labels: {stage: verification, test: traf-quality}
      container:
        image: *img
        # Always: SHA tags here are mutable in practice — a rebuild of the same
        # commit re-pushes the tag to a new digest. With IfNotPresent a node
        # serves whatever it cached first, which silently ran a stale image
        # through a whole test on 2026-07-20.
        imagePullPolicy: Always
        command:
          - python
          - -m
          - src.cli.cli_modular
          - verify-urls
          - --batch-size
          - "50"
          - --idle-grace-seconds
          - "120"
          - --log-level
          - INFO
        env:
          - {name: INTER_REQUEST_MIN, value: "5.0"}
          - {name: INTER_REQUEST_MAX, value: "15.0"}
          - {name: DATABASE_ENGINE, value: "postgresql+psycopg2"}
          - {name: DATABASE_HOST, value: "127.0.0.1"}
          - {name: DATABASE_PORT, value: "5432"}
          - name: DATABASE_USER
            valueFrom: {secretKeyRef: {name: cloudsql-db-credentials, key: username}}
          - name: DATABASE_PASSWORD
            valueFrom: {secretKeyRef: {name: cloudsql-db-credentials, key: password}}
          - name: DATABASE_NAME
            valueFrom: {secretKeyRef: {name: cloudsql-db-credentials, key: database}}
          - {name: DATABASE_URL, value: "$(DATABASE_ENGINE)://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"}
          - {name: TELEMETRY_DATABASE_URL, value: "$(DATABASE_ENGINE)://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"}
          - {name: USE_CLOUD_SQL_CONNECTOR, value: "true"}
          - {name: CLOUD_SQL_INSTANCE, value: "mizzou-news-crawler:us-central1:mizzou-db-prod-ssd"}
          - {name: PROXY_PROVIDER, value: "squid"}
          - name: SQUID_PROXY_URL
            valueFrom: {secretKeyRef: {name: squid-proxy-credentials, key: squid-proxy-url}}
          - {name: GOOGLE_CLOUD_PROJECT, value: "mizzou-news-crawler"}
          - {name: NO_PROXY, value: "localhost,127.0.0.1,metadata.google.internal,huggingface.co,*.huggingface.co"}
        resources:
          requests: {cpu: 250m, memory: 1Gi}
          limits: {cpu: 1000m, memory: 3Gi}

    - name: extract
      metadata:
        labels: {stage: extraction, test: traf-quality}
      container:
        image: *img
        # Always: SHA tags here are mutable in practice — a rebuild of the same
        # commit re-pushes the tag to a new digest. With IfNotPresent a node
        # serves whatever it cached first, which silently ran a stale image
        # through a whole test on 2026-07-20.
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - |
            /usr/local/bin/xvfb-wrapper.sh python -m src.cli.cli_modular extract \
              --limit 3 --batches 20 --log-level INFO
        env:
          - {name: USE_WORK_QUEUE, value: "true"}
          - {name: WORK_QUEUE_URL, value: "http://work-queue.production.svc.cluster.local:8080"}
          - {name: INTER_REQUEST_MIN, value: "5.0"}
          - {name: INTER_REQUEST_MAX, value: "15.0"}
          - {name: BATCH_SLEEP_SECONDS, value: "30.0"}
          - {name: SELENIUM_DRIVER_REUSE_LIMIT, value: "3"}
          - {name: SELENIUM_EXECUTION_MODE, value: "headful"}
          - {name: SELENIUM_PROXY, valueFrom: {secretKeyRef: {name: squid-proxy-credentials, key: selenium-proxy-url}}}
          - {name: DATABASE_ENGINE, value: "postgresql+psycopg2"}
          - {name: DATABASE_HOST, value: "127.0.0.1"}
          - {name: DATABASE_PORT, value: "5432"}
          - name: DATABASE_USER
            valueFrom: {secretKeyRef: {name: cloudsql-db-credentials, key: username}}
          - name: DATABASE_PASSWORD
            valueFrom: {secretKeyRef: {name: cloudsql-db-credentials, key: password}}
          - name: DATABASE_NAME
            valueFrom: {secretKeyRef: {name: cloudsql-db-credentials, key: database}}
          - {name: DATABASE_URL, value: "$(DATABASE_ENGINE)://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"}
          - {name: TELEMETRY_DATABASE_URL, value: "$(DATABASE_ENGINE)://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"}
          - {name: USE_CLOUD_SQL_CONNECTOR, value: "true"}
          - {name: CLOUD_SQL_INSTANCE, value: "mizzou-news-crawler:us-central1:mizzou-db-prod-ssd"}
          - {name: PROXY_PROVIDER, value: "squid"}
          - name: SQUID_PROXY_URL
            valueFrom: {secretKeyRef: {name: squid-proxy-credentials, key: squid-proxy-url}}
          - {name: GOOGLE_CLOUD_PROJECT, value: "mizzou-news-crawler"}
          - {name: NO_PROXY, value: "localhost,127.0.0.1,metadata.google.internal,huggingface.co,*.huggingface.co"}
        resources:
          requests: {cpu: 250m, memory: 2Gi}
          limits: {cpu: 1000m, memory: 6Gi}
