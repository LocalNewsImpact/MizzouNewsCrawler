apiVersion: v1
kind: Pod
metadata:
  name: selenium-cookie-inject-test
  namespace: production
spec:
  restartPolicy: Never
  containers:
    - name: crawler
      image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/crawler:2b36d0a
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c"]
      args:
        - |
          echo "Pod ready; sleeping to allow debug operations";
          sleep 3600
      volumeMounts:
        - name: chrome-profile-data
          mountPath: /var/selenium/profile
          readOnly: true
  volumes:
    - name: chrome-profile-data
      persistentVolumeClaim:
        claimName: chrome-profile-macos-default-pvc
