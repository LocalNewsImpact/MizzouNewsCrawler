          - heading "ABOUT US" [level=1] [ref=e66]
          - generic [ref=e67]:
            - paragraph [ref=e68]: If you care about Washington state, you should be reading the Standard. The Washington State Standard is an independent, nonprofit news organization that produces original reporting on policy and politics. We help readers understand how Washington state government works and how decisions made by those in power affect people living and working here. Our stories shed light on how the state is spending tax dollars, implementing laws and carrying out major projects. At election time, you can turn to us for campaign coverage and during the legislative session we’ll have the latest on all the action in Olympia.
            - paragraph [ref=e69]: We do not shy away from tough stories and we delve into the state’s most critical issues, like housing, homelessness, education, environmental concerns and criminal justice. We always strive for fairness with our reporting and make sure underrepresented communities have a voice in our coverage. On our commentary pages you can find thought-provoking opinion articles by writers who are not part of our nonpartisan news reporting staff.
            - paragraph [ref=e70]: As a nonprofit, funded by donations, we have no paywalls, no ads and no subscription fees. Thanks for reading!
            - paragraph [ref=e71]:
              - text: The Washington State Standard is an affiliate of
              - link "States Newsroom" [ref=e73] [cursor=pointer]:
                - /url: https://www.statesnewsroom.com/
              - generic [ref=e74]:
                - text: ", the nation’s largest state-focused nonprofit news organization, supported by"
                - link "grants and donations" [ref=e76] [cursor=pointer]:
                  - /url: https://statesnewsroom.com/support/
                - text: . The Standard retains full editorial independence. Consider a tax-exempt donation to support our work.
            - paragraph [ref=e77]: Free to Republish
            - paragraph [ref=e78]:
              - text: "Our articles are available to other outlets under Creative Commons licensing. If you have any questions about republishing, contact us at:"
              - link "info@washingtonstatestandard.com" [ref=e79] [cursor=pointer]:
                - /url: mailto:info@washingtonstatestandard.com
              - text: .
            - paragraph [ref=e81]: Tips, Questions, Comments, Corrections
            - paragraph [ref=e82]:
              - text: You can send news tips, feedback and questions to editor, Bill Lucia, via
              - link "blucia@washingtonstatestandard.com" [ref=e83] [cursor=pointer]:
                - /url: mailto:blucia@washingtonstatestandard.com
              - text: . Please also let us know about errors, clarifications or suggestions for followup stories. We appreciate you taking time to do so.
