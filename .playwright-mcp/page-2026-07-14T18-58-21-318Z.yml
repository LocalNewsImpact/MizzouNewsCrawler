            - paragraph [ref=e238]: Jake joined the Standard after working as a breaking news reporter, investigative reporter and news editor at The Everett Herald. He previously covered state politics as an intern at The Seattle Times. He graduated from the University of Washington, where he edited news coverage for the student paper. In his free time, he enjoys exploring the outdoors and watching movies.
