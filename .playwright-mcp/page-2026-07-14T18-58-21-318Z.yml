              - heading "Editor-in-Chief" [level=4] [ref=e198]
            - paragraph [ref=e200]: Bill has a decade of experience covering state and local policy and politics, including as a city reporter in Seattle for Crosscut. Most recently, he spent eight years as a reporter and editor for Government Executive’s Route Fifty, an online news journal for state and local public officials that covers trends, challenges and emerging issues in states and localities across the U.S. During his time there, he also reported and oversaw extensive coverage on how federal policy and action by Congress affects the nation’s states, cities and counties. Bill holds a master's in public administration from the University of Washington's Evans School of Public Policy & Governance. In his free time, he enjoys rock climbing, running and sea kayaking.
