              - heading "Reporter" [level=4] [ref=e255]
            - paragraph [ref=e257]: Aspen Ford is an award-winning reporter covering Washington state. She joined The Standard after completing a Roy W. Howard Fellowship at InvestigateWest, where she reported on Washington’s public defender crisis, chemical exposure complaints at SpaceX and regulatory failures that led to public health concerns in Washington and Oregon. Aspen graduated from Arizona State University in 2024 with a master’s degree in investigative journalism. While at ASU, she won an award for her reporting on the university’s handling of the Native American Graves Protection and Repatriation Act. Outside of work, she enjoys photography and exploring Washington’s coastlines.
