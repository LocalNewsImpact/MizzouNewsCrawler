              - heading "Reporter" [level=4] [ref=e217]
            - paragraph [ref=e219]: Jerry Cornfield started as a crime reporter in San Francisco and spent the better part of the last four decades covering politics and government in California and Washington. He’s worked the last 20 years as the statehouse reporter for The Daily Herald of Everett. Before then, he worked in media for 12 years in Santa Barbara, reporting for daily and weekly newspapers, serving as editor-at-large for Santa Barbara magazine, producing and hosting a daily radio talk show, and appearing regularly as a political commentator on network TV.
