# Enriching one dataset on demand.
#
# `k8s/enrichment-cronjob.yaml` names a single dataset in its args
# (`Mizzou-Missouri-State`) while its own header says it runs "against the
# datasets whose profiles enable enrichment". A second dataset that acquires a
# profile is therefore never enriched on schedule and has no entry point at
# all, which is what happened to WSU-Washington-State on 2026-09-17: 447
# articles at `labeled` with a v3 profile and nothing that would run them.
#
# This is that entry point. It is the housekeeping template's `enrich-step`,
# unchanged apart from the command:
#
#     housekeeping: enrich backfill --rework   -- the named set from
#                                                pipeline_rework
#     here:         enrich run --dataset X     -- every article at `labeled`
#                                                in one dataset
#
# `run` is correct here and wrong there. Housekeeping carries records a
# reviewer rewound and must never sweep, so it takes an explicit set. Bringing
# a dataset up for the first time IS the sweep, and the ceiling is what bounds
# it.
#
# Submit it:
#
#     argo submit -n production --from workflowtemplate/dataset-enrichment \
#       -p dataset=WSU-Washington-State
#
# `serviceAccountName` is declared on this spec rather than left to the
# submitter. Argo defaults a `--from workflowtemplate` submit to the `default`
# service account, which carries no `iam.gke.io/gcp-service-account`
# annotation and therefore no Workload Identity, and the step dies on
# `403 boss::NOT_AUTHORIZED: cloudsql.instances.get`. Only `argo-workflow` and
# `mizzou-app` carry that annotation.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dataset-enrichment
  namespace: production
  labels:
    type: enrichment
spec:
  entrypoint: enrich-dataset
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: dataset
        # No default. A default here is a dataset somebody did not choose,
        # and the step spends money per article.
      - name: limit
        # The CLI default is 200. A dataset coming up for the first time has
        # more than that, and a limit below the backlog looks like a complete
        # run: WSU had 447 candidates, so 200 would have left 247 behind with
        # nothing to say so.
        value: "500"
      - name: ceiling
        # Matches the enrichment CronJob. At $0.0075/article this covers ~666
        # articles; the orchestrator halts the batch on reaching it and
        # `enrich run` resumes by status, so a larger dataset takes two runs
        # rather than an overspend.
        value: "5.00"
  templates:
    - name: enrich-dataset
      inputs:
        parameters:
          - name: dataset
          - name: limit
          - name: ceiling
      metadata:
        labels:
          stage: enrichment
          component: enrichment
      # No retry. Enrichment spends money per article, and a retried batch is
      # a batch paid for twice: `enrich run` is resumable by status, so the
      # next run continues from wherever this one stopped.
      container:
        image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/enrichment:${ENRICHMENT_TAG}
        imagePullPolicy: IfNotPresent
        command:
          - python
          - -m
          - src.cli.cli_modular
          - enrich
          - run
          - --dataset
          - "{{inputs.parameters.dataset}}"
          - --limit
          - "{{inputs.parameters.limit}}"
        env:
          - name: ENRICHMENT_SPEND_CEILING_USD
            value: "{{inputs.parameters.ceiling}}"
          - name: OPENROUTER_API_KEY
            valueFrom:
              secretKeyRef:
                name: openrouter-credentials
                # The key the secret actually holds. `api-key` does not exist
                # in it, and kubelet answers that with "couldn't find key
                # api-key in Secret production/openrouter-credentials" and
                # restarts the container -- 278 times over 63 minutes in the
                # housekeeping workflow, reported as Pending rather than
                # Failed the whole time.
                key: OPENROUTER_API_KEY
          - name: DATABASE_ENGINE
            value: "postgresql+pg8000"
          - name: DATABASE_HOST
            value: "127.0.0.1"
          - name: DATABASE_PORT
            value: "5432"
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: cloudsql-db-credentials
                key: username
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: cloudsql-db-credentials
                key: password
          - name: DATABASE_NAME
            valueFrom:
              secretKeyRef:
                name: cloudsql-db-credentials
                key: database
          - name: USE_CLOUD_SQL_CONNECTOR
            value: "true"
          - name: CLOUD_SQL_INSTANCE
            value: "mizzou-news-crawler:us-central1:mizzou-db-prod-ssd"
          - name: LOG_LEVEL
            value: "INFO"
        # Enrichment holds one article and calls a model over the network,
        # which is what the enrichment CronJob asks for and has never
        # exceeded.
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
