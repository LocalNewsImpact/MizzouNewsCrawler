# Through the day, and the first slot deliberately after the other
# housekeeping.
#
# `mizzou-housekeeping` (k8s/housekeeping-cronjob.yaml) runs at 02:00 and
# applies reviewed geography; this runs at 03:00 so a record it carries to
# `enriched` is not one that job was still working on.
#
# Before the 07:00 BigQuery sync either way, so a record that reaches its
# terminal status overnight is published the same morning.
#
# `Forbid`, not `Replace`: a run that is still going is doing real work
# with a spend ceiling attached, and replacing it would start a second
# ceiling rather than continue the first.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: news-housekeeping
  namespace: production
  labels:
    type: housekeeping
spec:
  # SIX TIMES A DAY, NOT ONCE, so a queue larger than one window drains
  # the same day instead of a day per window.
  #
  # It was `0 3 * * *`. A review session on 2026-09-14 queued 235 records
  # at 22:00 UTC; the run took 227 of them and was killed by the deadline
  # eight short, and those eight then had no further chance until 03:00
  # the next night. Nothing retried in between, because nothing was
  # scheduled in between.
  #
  # An extra slot is nearly free when there is nothing to do:
  # `anything-owed` runs first and stops the workflow before a stage pod
  # starts, so a quiet slot costs one short guard pod. `Forbid` means a
  # slot that arrives while the previous run is still going is skipped
  # rather than doubling the work -- which is what makes this "restart
  # until the queue is clear" rather than "run six times".
  #
  # 06:00-09:00 UTC IS LEFT EMPTY ON PURPOSE. Every slot is capped at
  # three hours, so a run starting at 03:00 is finished by 06:00 and the
  # next does not begin until 09:00 -- the 07:00 BigQuery sync therefore
  # never reads while a run is writing. `test_no_run_spans_the_bigquery_sync`
  # holds that for every slot, not just the first.
  schedule: "0 3,9,12,15,18,21 * * *"
  timezone: "UTC"
  # RUNNING. This job processes whatever work a review-queue disposition
  # presents, every night, and nothing else.
  #
  # It is not coupled to the dataset crons. Those are suspended on purpose
  # because they go looking for URLs; this one does no discovery and no
  # verification -- it reads `pipeline_rework`, carries only the records a
  # decision rewound, and stops. Suspending it alongside them conflated two
  # unrelated decisions, and the cost was that a disposition made in a
  # queue reached nothing.
  #
  # It was held suspended until datadesk was writing `pipeline_rework`
  # rows, which it is: 257 rows, 217 of them closed with recorded outcomes
  # across extract, classify and enrich as of 2026-09-13.
  #
  # The sweep that justified the suspension -- a run took 4,802 links when
  # the dispositions accounted for 45 -- is fixed at the source: every
  # stage takes `--rework` and reads that table, and `anything-owed` stops
  # an empty night before a pod starts. Both are held in place by tests
  # (test_no_stage_runs_a_bare_sweeping_command,
  # test_a_run_with_nothing_owed_stops_before_starting_a_stage).
  #
  # Declared here, not patched on the cluster: a patch is invisible in the
  # repository and undone by the next apply. Pausing is a change to this
  # file.
  suspend: false
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  workflowSpec:
    # THREE HOURS PER SLOT, so the 03:00 run is finished before the 07:00
    # UTC BigQuery sync reads the result, and no later slot is running
    # across it either. Better to stop with rows still open -- the next
    # slot takes them, because they are still in pipeline_rework -- than
    # to overrun the sync with a run still going and publish the work a
    # day late.
    #
    # The deadline runs from when a run STARTS, not from 03:00: a manual
    # submission at 22:00 UTC gets three hours from 22:00.
    activeDeadlineSeconds: 10800
    ttlStrategy:
      secondsAfterSuccess: 43200
      secondsAfterFailure: 43200
    entrypoint: housekeeping-wrapper
    # A REVIEWER'S GEOGRAPHY IS APPLIED WHATEVER THE RUN DID.
    #
    # `enrich apply-manual` moves geography a person entered from
    # `article_places_manual` into `article_geoids`, which is what
    # BigQuery's "Sync Article Geoids" reads, unfiltered, at 07:00 UTC.
    # It has to run daily, and it cannot be a step:
    #
    #   - a step after `enrich` does not run when enrichment fails, and
    #     all four runs on 2026-09-13 ended with `enrich` failed;
    #   - a step gated on `anything-owed` does not run on a quiet night,
    #     and a geography decision writes no `pipeline_rework` row -- the
    #     reconciler reads the discovery and extraction queues, not that
    #     one -- so the count is blind to this work and a night with no
    #     rework still has contributions to move.
    #
    # An exit handler answers both: it runs once the run finishes, whatever
    # phase it finished in and whichever steps were skipped. It also runs
    # AFTER enrichment, which the ordering requires -- `persist_outcome`
    # DELETEs an article's `article_geoids` rows before writing its own, so
    # applying a person's geography earlier would let the same night delete
    # it.
    #
    # It is declared HERE and not on the WorkflowTemplate because the
    # wrapper reaches that template through `templateRef`, and a
    # WorkflowTemplate's spec-level fields are not inherited through one.
    # An `onExit` over there lints clean and never fires.
    #
    # MEASURED, not assumed -- k8s/argo/probes/onexit-semantics-probe.yaml
    # submits two busybox pods and reports which cases run the handler.
    # Against this cluster on 2026-09-13, Argo v3.7.3:
    #
    #   entrypoint step FAILS      workflow Failed      handler RAN
    #   entrypoint step SKIPPED    workflow Succeeded   handler RAN
    #   argo stop                  workflow Failed      handler RAN
    #   argo terminate             workflow Failed      handler DID NOT RUN
    #
    # The first two rows are the cases this exists for. The last is a real
    # gap: prefer `argo stop` over `argo terminate` when a run has to be cut
    # short and the night's contributions should still land. All four manual
    # interventions on 2026-09-13 used terminate.
    onExit: apply-manual-geography
    serviceAccountName: argo-workflow
    workflowMetadata:
      labels:
        type: housekeeping
        schedule: daily
    templates:
    - name: housekeeping-wrapper
      steps:
      - - name: run-housekeeping
          templateRef:
            name: housekeeping-template
            template: housekeeping

    # The exit handler. `onExit` names a template in this spec, so it
    # cannot be a `templateRef` on its own -- it wraps one.
    - name: apply-manual-geography
      steps:
      - - name: apply-manual
          templateRef:
            name: housekeeping-template
            template: apply-manual-step
