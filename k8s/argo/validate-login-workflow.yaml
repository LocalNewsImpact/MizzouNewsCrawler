# One witnessed publisher login, run in the cluster.
#
# `news-crawler validate-login` is the entry-time half of
# docs/A_LOGIN_IS_WITNESSED_AT_ENTRY.md: it signs in through the crawler's own
# driver and login mechanism and prints the evidence -- the vendor's auth
# response, whether the login control went hidden, which first-party cookies
# changed (names only). With `record=true` it writes that evidence to
# `auth_config.witnessed`.
#
# It needs the crawler image (Chrome + Xvfb), the Squid egress the extraction
# worker uses, Cloud SQL, and Secret Manager for the `publisher-auth-*`
# credentials. No long-running pod has all four, so before this template a
# validation meant hand-building a debug pod. Every credentialed host is
# validated once on arrival and again whenever its credentials change.
#
#     argo submit -n production --from workflowtemplate/validate-login \
#       -p host=www.cascadiadaily.com --watch
#
#     # once the evidence reads as a login, record it
#     argo submit -n production --from workflowtemplate/validate-login \
#       -p host=www.cascadiadaily.com -p record=true -p path=page --watch
#
#     argo logs -n production @latest
#
# Read the evidence before recording. A run without `record=true` writes
# nothing, so the first submit is safe to repeat -- but each submit IS a login.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: validate-login
  namespace: production
  labels:
    type: validation
spec:
  entrypoint: validate-login
  # Declared here rather than left to the submitter: a `--from
  # workflowtemplate` submit otherwise runs as `default`, which has no Workload
  # Identity and so neither Cloud SQL nor Secret Manager.
  serviceAccountName: argo-workflow
  # A login is a few page loads. Anything near this deadline is a hung
  # chromedriver, not a slow site.
  activeDeadlineSeconds: 900
  arguments:
    parameters:
      - name: host
        # No default. sources.host_norm of the one publisher to sign in to.
      - name: record
        # "true" writes the evidence to auth_config.witnessed and clears
        # auth_last_failed_at. Anything else writes nothing.
        value: "false"
      - name: path
        # How the login is reached: page, modal or sso. Stored only with
        # record=true. Empty leaves it unset.
        value: ""
  templates:
    - name: validate-login
      inputs:
        parameters:
          - name: host
            value: "{{workflow.parameters.host}}"
          - name: record
            value: "{{workflow.parameters.record}}"
          - name: path
            value: "{{workflow.parameters.path}}"
      metadata:
        labels:
          stage: validate-login
          workflow-name: "{{workflow.name}}"
          workflow-uid: "{{workflow.uid}}"
      # No retryStrategy, on purpose. A failed login is the evidence, and
      # publishers count failures: cascadiadaily.com locks the account after
      # a handful ("4 login attempts remaining"). A retry would spend those
      # attempts on a credential already shown to be wrong.
      container:
        image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/crawler:${CRAWLER_TAG}
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            args=(validate-login --host "{{inputs.parameters.host}}")
            if [ "{{inputs.parameters.record}}" = "true" ]; then
              args+=(--record)
            fi
            if [ -n "{{inputs.parameters.path}}" ]; then
              args+=(--path "{{inputs.parameters.path}}")
            fi
            # INFO, and not a parameter. At DEBUG selenium's remote_connection
            # logger records every browser command, and a login's send_keys
            # carries the password -- pod logs ship to Cloud Logging. See
            # log-level in authenticated-extraction-workflow.yaml.
            /usr/local/bin/xvfb-wrapper.sh python -m src.cli.cli_modular \
              --log-level INFO "${args[@]}"
        env:
          # Database: the same Cloud SQL connector wiring as extraction-step.
          - name: DATABASE_ENGINE
            value: "postgresql+psycopg2"
          - name: DATABASE_HOST
            value: "127.0.0.1"
          - name: DATABASE_PORT
            value: "5432"
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: cloudsql-db-credentials
                key: username
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: cloudsql-db-credentials
                key: password
          - name: DATABASE_NAME
            valueFrom:
              secretKeyRef:
                name: cloudsql-db-credentials
                key: database
          - name: DATABASE_URL
            value: "$(DATABASE_ENGINE)://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
          - name: TELEMETRY_DATABASE_URL
            value: "$(DATABASE_ENGINE)://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
          - name: USE_CLOUD_SQL_CONNECTOR
            value: "true"
          - name: CLOUD_SQL_INSTANCE
            value: "mizzou-news-crawler:us-central1:mizzou-db-prod-ssd"
          # The extraction worker's egress. A login validated from another IP
          # proves nothing about the one the worker will sign in from.
          - name: PROXY_PROVIDER
            value: "squid"
          - name: SQUID_PROXY_URL
            valueFrom:
              secretKeyRef:
                name: squid-proxy-credentials
                key: squid-proxy-url
          - name: SELENIUM_PROXY
            valueFrom:
              secretKeyRef:
                name: squid-proxy-credentials
                key: selenium-proxy-url
          # Secret Manager project for the publisher-auth-* credentials.
          - name: GOOGLE_CLOUD_PROJECT
            value: "mizzou-news-crawler"
          - name: NO_PROXY
            value: "localhost,127.0.0.1,metadata.google.internal,huggingface.co,*.huggingface.co"
          - name: SELENIUM_EXECUTION_MODE
            value: "headful"
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 6Gi
