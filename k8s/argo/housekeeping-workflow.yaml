# Carrying rewound records to their terminal status.
#
# This is not a new pipeline. It is the same stages, in the same order,
# selecting on the same statuses -- run small and daily so that a record
# whose status a reviewer changed still reaches the end while the
# production crons are suspended. With the crons running these records
# are picked up in the ordinary way and this workflow finds nothing to
# do, which is the correct outcome rather than a wasted run.
#
# It is the pipeline MINUS DISCOVERY AND VERIFICATION, and that is what
# makes it housekeeping rather than a second copy of the thing.
#
# Extraction is collection -- it goes out and fetches -- and housekeeping
# does it, because a record waiting at `article` has a URL already found
# and already verified, and fetching it is the next step of finishing
# it. What housekeeping does not do is look for URLs that are not yet
# known: discovery walks a publisher's site, verification judges what it
# found, and both belong to the dataset crons that do that at scale.
#
# IT STARTS AT EXTRACTION, on records whose URL is already found and
# already verified.
#
# Every stage selects by STATUS, so nothing here needs a list of ids:
#
#     candidate_links.status = 'article'  -> extract
#     (cleaned, unlabelled)              -> analyze
#     articles.status        = 'labeled'  -> enrich
#
# Put a record in the right status and the pipeline carries it. A link a
# reviewer restores to `discovered` is not this workflow's business; it
# waits for verification to run as part of ordinary collection.
#
# Idempotent by construction. A stage that fails leaves its records in
# the status they were already in, so tomorrow's run picks up exactly
# what today's did not, and nothing is processed twice.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: housekeeping-template
  namespace: production
  labels:
    type: housekeeping
spec:
  templates:
  - name: housekeeping
    inputs:
      parameters:
      # Bounds on a run, not on what it selects: what it selects is
      # `pipeline_rework`. These keep one night's run inside its window.
      - name: extract-limit
        value: "25"
      - name: extract-batches
        value: "8"
      - name: classify-limit
        value: "500"
      # Enrichment spends money. `backfill` takes the named set and the
      # ceiling caps the night whatever that set's size.
      - name: enrich-ceiling
        value: "10"
    # EVERY STAGE READS `pipeline_rework` AND NOTHING ELSE.
    #
    # Every pipeline stage selects by status, and a rewound record shares
    # its status with the whole backlog -- so a stage told nothing takes
    # everything. A run of this began extracting 4,802 links when the
    # dispositions accounted for 45. `--rework` on each stage reads the
    # table that names the records a decision rewound, and an empty table
    # means nothing to do, never "everything".
    #
    # The first step counts what is owed and stops the run if nothing is.
    # An empty night costs a few seconds.
    #
    # APPLYING A REVIEWER'S GEOGRAPHY IS NOT A STEP HERE.
    #
    # It was a sixth step, and a sixth step does not run: Argo stops a
    # sequential `steps:` list at the first failure, so a transient
    # enrichment failure -- a model timeout, a ceiling hit, a terminated
    # run -- means the step after it never starts. All four runs on
    # 2026-09-13 ended with `enrich` failed. It would have run in none of
    # them, and the contributions it exists to move would have sat exactly
    # as they did before it was added.
    #
    # It is the RUN's exit handler instead, declared on the cronworkflow's
    # `workflowSpec.onExit`, which is where an exit handler actually fires:
    # this template is invoked by `templateRef`, and a WorkflowTemplate's
    # spec-level fields are not inherited through one. An `onExit` here
    # lints clean and never runs. `apply-manual-step` below is the template
    # the cron's handler references.
    steps:
    # 0. Put stranded wire checks back in the queue.
    #
    # BEFORE THE GATE AND NOT INSIDE IT. `anything-owed` asks whether
    # `pipeline_rework` owes anything, and a stranded wire check owes
    # nothing -- no review rewound it, so no rework row names it. Gating
    # this behind that count would mean the flag is only ever reclaimed
    # on nights that happen to have rework, which is most nights not at
    # all. It is one UPDATE and it is the daily maintenance this workflow
    # exists to do.
    - - name: reclaim-wire-checks
        template: reclaim-wire-checks-step

    # 1. Is anything owed? A run with nothing to carry stops here.
    - - name: anything-owed
        template: anything-owed-step

    # 1. How many extraction workers this night needs.
    - - name: rework-workers
        template: rework-worker-count
        when: "{{steps.anything-owed.outputs.result}} != 0"

    # 2. Links a decision rewound to `article`, and only those.
    #
    # Every step passes what its template declares, explicitly. A step
    # that passes nothing is not defaulted: Argo REFUSES the workflow --
    # `templates.classify-step inputs.parameters.limit was not supplied`
    # -- at submit, before any stage runs. The schedule was suspended, so
    # that error waited to be the first thing a resumed run did.
    #
    #    PARALLEL, AND THROUGH THE WORK QUEUE, exactly as the pipeline
    #    template runs extraction. The housekeeping run is not a different
    #    kind of extraction: it is the same workers, the same queue and the
    #    same domain fairness, with a narrower set of records going in.
    #    That set is the difference and the only difference -- the queue
    #    serves a link only if `pipeline_rework` still owes work on it.
    #
    #    One worker at a time was the reason a run of 97 links was going to
    #    miss its window: each page costs two to four minutes when the
    #    first fetch comes back unusable and Selenium retries, so 97 of
    #    them serially is hours.
    - - name: extract
        template: extraction-step
        when: "{{steps.anything-owed.outputs.result}} != 0"
        withParam: "{{steps.rework-workers.outputs.result}}"
        arguments:
          parameters:
          - name: limit
            value: "{{inputs.parameters.extract-limit}}"
          - name: batches
            value: "{{inputs.parameters.extract-batches}}"
          - name: worker-pool
            value: "anonymous"

    # 2b. The same rework, for hosts that need a login.
    #
    # A SECOND PASS, not a `mixed` one. One worker cannot serve both kinds: an
    # anonymous host needs the driver rotated every few fetches so a publisher
    # cannot fingerprint one machine working steadily through its site, and a
    # credentialed host needs the driver HELD or every visit pays a fresh login.
    # `mixed` picks one and is wrong for the other half, which is what
    # src/utils/worker_pool.py exists to stop. Running this pass as `anonymous`
    # instead would be worse still: credentialed rework would be claimable by
    # nobody, since the queue's `requires_login=False` is an assertion and not
    # an absent filter.
    #
    # SEQUENTIAL, in its own step group. Two authenticated workers on one host
    # mean two concurrent sessions for one subscriber account, and no publisher
    # here has been asked whether that is tolerated -- the same unknown that
    # keeps the standalone authenticated worker count at 1. One worker, after
    # the anonymous pass, costs wall-clock and nothing else.
    #
    # `withParam` is deliberately absent for the same reason.
    - - name: extract-credentialed
        template: extraction-step
        when: "{{steps.anything-owed.outputs.result}} != 0"
        arguments:
          parameters:
          - name: limit
            value: "{{inputs.parameters.extract-limit}}"
          - name: batches
            value: "{{inputs.parameters.extract-batches}}"
          - name: worker-pool
            value: "authenticated"

    # 3. Articles a decision sent back to `cleaned`, and only those.
    - - name: classify
        template: classify-step
        when: "{{steps.anything-owed.outputs.result}} != 0"
        arguments:
          parameters:
          - name: limit
            value: "{{inputs.parameters.classify-limit}}"

    # 4. Articles owing enrichment, and only those -- through `backfill`,
    #    which takes a named set. Never `enrich run`, which takes every
    #    article at `labeled`: 85,189 of them, and a ceiling that would be
    #    spent on records nobody asked about.
    - - name: enrich
        template: enrich-step
        when: "{{steps.anything-owed.outputs.result}} != 0"
        arguments:
          parameters:
          - name: ceiling
            value: "{{inputs.parameters.enrich-ceiling}}"

    # 5. Geography a person put in, into `article_geoids` -- and so into
    #    BigQuery, whose "Sync Article Geoids" reads that table unfiltered
    #    at 07:00 UTC.
    #
    #    NOT gated on `anything-owed`. A geography decision writes no
    #    pipeline_rework row -- the reconciler reads the discovery and
    #    extraction queues, not this one -- so the count this workflow
    #    tests is blind to it, and gating here would mean a night with no
    #    rework carried no contributions either. That is how 56 of them
    #    sat unapplied: the command existed, was documented as needing to
    #    run daily before 07:00 UTC, and was wired into nothing.
  # --- the stages this workflow defines for itself ---------------------
  #
  # Not reused from `news-pipeline-template`: its extraction step takes a
  # dataset, because that template exists to work one publisher set hard.
  # This one takes none, because a rewound record is carried whichever
  # dataset it is in.

  - name: extraction-step
    inputs:
      parameters:
      # Required, no defaults: the caller passes them. A default here
      # would let a step that passes nothing look correct, which is the
      # shape that made `classify-step` fail at submit.
      - name: limit
      - name: batches
      # Which hosts this pass draws from. A FLAG, not an env var: this template
      # DEFINES the shared `&db_env` anchor that `classify-step` and
      # `enrich-step` alias, so an input-referencing entry in that list hands
      # the reference to templates that cannot resolve it -- the failure the
      # comment below already records. Required, no default, for the reason
      # given there: a caller that passes nothing must not look correct.
      - name: worker-pool
      # No `worker` parameter. `withParam` fans this step out over the
      # worker list and each pod identifies itself to the queue by its own
      # name, so a worker number here would be a declared input that
      # nothing reads -- and putting it in an env var inside the shared
      # `&db_env` anchor carried the reference into templates that cannot
      # resolve it, which made the workflow unsubmittable.
    metadata:
      labels:
        stage: extraction
        housekeeping: "true"
    retryStrategy:
      limit: 2
      retryPolicy: "OnFailure"
      backoff:
        duration: "5m"
        factor: 2
        maxDuration: "20m"
    container:
      image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/crawler:${CRAWLER_TAG}
      imagePullPolicy: IfNotPresent
      command:
        - python
        - -m
        - src.cli.cli_modular
        - extract
        # THE RECORDS, NOT THE STATUS. Without --rework `extract` takes
        # every link at `article` -- 4,802 of them the day this was
        # written, against 45 that a decision had rewound.
        - --rework
        - --limit
        - "{{inputs.parameters.limit}}"
        - --batches
        - "{{inputs.parameters.batches}}"
        - --worker-pool
        - "{{inputs.parameters.worker-pool}}"
      envFrom:
        - configMapRef:
            name: crawler-config
            optional: true
      env: &db_env
        - name: DATABASE_ENGINE
          value: "postgresql+pg8000"
        - name: DATABASE_HOST
          value: "127.0.0.1"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: password
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: database
        - name: USE_CLOUD_SQL_CONNECTOR
          value: "true"
        - name: CLOUD_SQL_INSTANCE
          value: "mizzou-news-crawler:us-central1:mizzou-db-prod-ssd"
        - name: PROXY_PROVIDER
          value: "squid"
        - name: SQUID_PROXY_URL
          valueFrom:
            secretKeyRef:
              name: squid-proxy-credentials
              key: squid-proxy-url
        - name: LOG_LEVEL
          value: "INFO"
        # The same queue the pipeline's extraction workers use. It hands
        # each worker its own domains, so four workers do not all queue up
        # behind one publisher, and it serves only records
        # `pipeline_rework` still owes work on -- the request carries
        # `rework: true`, which is the whole of the difference between a
        # housekeeping worker and a pipeline worker.
        #
        # INSIDE THE ANCHOR, so every stage that aliases `db_env` gets it.
        # The worker number is NOT here: it is
        # `{{inputs.parameters.worker}}`, which only the extraction step
        # declares, and an anchor carries the text of a reference into
        # templates that cannot resolve it. Put there once, it made the
        # whole workflow unsubmittable:
        #
        #   templates.anything-owed-step: failed to resolve
        #   {{inputs.parameters.worker}}
        - name: USE_WORK_QUEUE
          value: "true"
        - name: WORK_QUEUE_URL
          value: "http://work-queue.production.svc.cluster.local:8080"
      # THE PIPELINE'S OWN NUMBERS, not smaller ones because the batches
      # are smaller. A single article is what costs the memory here --
      # parsing one large page, not the size of the batch around it -- so
      # extraction needs what extraction needs whether it runs 25 or
      # 20,000. The first run of this was OOMKilled at 2Gi.
      resources:
        requests:
          cpu: 250m
          memory: 2Gi
        limits:
          cpu: 1000m
          memory: 6Gi

  - name: classify-step
    inputs:
      parameters:
      # Required. Argo refuses the whole workflow at submit when a caller
      # does not pass it, which is what made this file unsubmittable.
      - name: limit
    metadata:
      labels:
        stage: classification
        housekeeping: "true"
    retryStrategy:
      limit: 2
      retryPolicy: "OnFailure"
      backoff:
        duration: "5m"
        factor: 2
        maxDuration: "20m"
    container:
      image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/processor:${PROCESSOR_TAG}
      imagePullPolicy: IfNotPresent
      command:
        - python
        - -m
        - src.cli.cli_modular
        - analyze
        # Same rule: 450 articles sit at `cleaned` and 14 of them were put
        # there by a review decision.
        - --rework
        - --limit
        - "{{inputs.parameters.limit}}"
      env: *db_env
      # The processor deployment's numbers: classification loads a model,
      # and the model does not get smaller with the batch either.
      resources:
        requests:
          cpu: 250m
          memory: 2Gi
        limits:
          cpu: 1000m
          memory: 4Gi

  - name: enrich-step
    inputs:
      parameters:
      # No default, and NOT `{{workflow.parameters.enrich-ceiling}}`:
      # nothing declares a workflow parameter by that name, so it
      # resolved to nothing and the ceiling this step spends against was
      # whatever an unresolved template string becomes. Required, and
      # passed by the caller, so a missing one fails at submit.
      - name: ceiling
    metadata:
      labels:
        stage: enrichment
        housekeeping: "true"
    # No retry. Enrichment spends money per article, and a retried batch
    # is a batch paid for twice: `enrich run` is resumable by status, so
    # tomorrow's run continues from wherever this one stopped.
    container:
      image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/enrichment:${ENRICHMENT_TAG}
      imagePullPolicy: IfNotPresent
      command:
        - python
        - -m
        - src.cli.cli_modular
        - enrich
        # `backfill --rework`, never `run`: `run` selects every article at
        # `labeled`; `backfill` takes the named set from pipeline_rework.
        - backfill
        - --rework
      env:
        - name: ENRICHMENT_SPEND_CEILING_USD
          value: "{{inputs.parameters.ceiling}}"
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: openrouter-credentials
              # The key the secret actually holds. `api-key` does not exist
              # in it, and kubelet answers that with "couldn't find key
              # api-key in Secret production/openrouter-credentials" and
              # restarts the container -- 278 times over 63 minutes, until
              # the workflow's deadline killed the run. Argo reported the
              # step Pending the whole time, not Failed, so the nightly run
              # looked like it was working.
              #
              # k8s/enrichment-cronjob.yaml has always used this name; this
              # file was written from memory instead of from that one.
              key: OPENROUTER_API_KEY
        - name: DATABASE_ENGINE
          value: "postgresql+pg8000"
        - name: DATABASE_HOST
          value: "127.0.0.1"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: password
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: database
        - name: USE_CLOUD_SQL_CONNECTOR
          value: "true"
        - name: CLOUD_SQL_INSTANCE
          value: "mizzou-news-crawler:us-central1:mizzou-db-prod-ssd"
        - name: LOG_LEVEL
          value: "INFO"
      # Enrichment holds one article and calls a model over the network,
      # which is what the enrichment CronJob asks for and has never
      # exceeded.
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

  # Counts what is owed. Its result is what every later step is gated on,
  # so a run with nothing to carry ends here in seconds rather than
  # starting three pods to find out.
  - name: apply-manual-step
    metadata:
      labels:
        stage: geography
        housekeeping: "true"
    # Retried freely, unlike the enrich step above: no model calls, and
    # the insert is `ON CONFLICT DO NOTHING`, so running it twice writes
    # the same rows once. Additive -- it must not touch what enrichment
    # wrote, and does not.
    container:
      image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/enrichment:${ENRICHMENT_TAG}
      imagePullPolicy: IfNotPresent
      command:
        - python
        - -m
        - src.cli.cli_modular
        - enrich
        # `backfill --rework`, never `run`: `run` selects every article at
        # `labeled`; `backfill` takes the named set from pipeline_rework.
        - apply-manual
      env:
        # No spend ceiling and no OpenRouter key: this step makes no
        # model calls. It reads `article_places_manual` and writes
        # `article_geoids`, which is the whole of it.
        - name: DATABASE_ENGINE
          value: "postgresql+pg8000"
        - name: DATABASE_HOST
          value: "127.0.0.1"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: password
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: database
        - name: USE_CLOUD_SQL_CONNECTOR
          value: "true"
        - name: CLOUD_SQL_INSTANCE
          value: "mizzou-news-crawler:us-central1:mizzou-db-prod-ssd"
        - name: LOG_LEVEL
          value: "INFO"
      # Enrichment holds one article and calls a model over the network,
      # which is what the enrichment CronJob asks for and has never
      # exceeded.
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

  # Counts what is owed. Its result is what every later step is gated on,
  # so a run with nothing to carry ends here in seconds rather than
  # starting three pods to find out.
  - name: rework-worker-count
    metadata:
      labels:
        stage: guard
        housekeeping: "true"
    script:
      image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/processor:${PROCESSOR_TAG}
      imagePullPolicy: IfNotPresent
      command: [python]
      # One worker per 25 links owed, bounded by how many DOMAINS the owed
      # links span, and then by a ceiling of 8.
      #
      # A page costs two to four minutes when the first fetch returns
      # something unusable and Selenium retries, so 25 links is around an
      # hour -- inside the three-hour deadline with room for the stages
      # after it.
      #
      # THE DOMAIN BOUND IS THE REAL ONE, and it used to be a flat cap of
      # 4. The queue hands out at most three articles per domain per
      # request, so a worker needs roughly three domains to stay busy:
      # past that, workers contend for publishers rather than adding
      # throughput. `hosts // 3` says that directly instead of guessing a
      # constant, so a batch spread thin across the state fans out and one
      # concentrated on three publishers still gets one worker.
      #
      # The flat 4 rested on a second assumption -- "a night's rework is
      # tens of records, not thousands" -- and a review session on
      # 2026-09-14 queued 235. The rule asked for 10 workers, the cap gave
      # it 4, and the run was killed by the three-hour deadline having
      # finished 227 of them: throttled to 40% of the parallelism its own
      # rule computed, it missed by eight records. Those 234 links spanned
      # 48 domains, 4.9 apiece, so nothing was contending -- the cap was
      # costing throughput it had been written to protect.
      #
      # The ceiling stays, at 8, because the proxy and Selenium capacity
      # this shares with everything else is not measured here. Eight
      # covers a 200-link night inside the window, and anything past it
      # is what the extra daily slots are for.
      source: |
        import json
        from sqlalchemy import text
        from src.models.database import DatabaseManager
        with DatabaseManager().get_session() as s:
            row = s.execute(text(
                "SELECT count(*) AS owed, count(DISTINCT split_part("
                "  regexp_replace(cl.url, '^https?://(www\\.)?', ''), '/', 1"
                ")) AS hosts "
                "FROM pipeline_rework r "
                "JOIN candidate_links cl ON cl.id = r.record_id "
                "WHERE r.record_type = 'candidate_link' AND r.done_at IS NULL "
                "AND cl.status = 'article' "
                "AND NOT EXISTS (SELECT 1 FROM articles a "
                "                WHERE a.candidate_link_id = cl.id)"
            )).one()
        owed, hosts = row.owed or 0, row.hosts or 0
        workers = max(1, min(8, -(-owed // 25), max(1, hosts // 3)))
        print(json.dumps([{"id": i + 1} for i in range(workers)]))
      env: *db_env
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

  - name: reclaim-wire-checks-step
    metadata:
      labels:
        stage: maintenance
        housekeeping: "true"
    script:
      image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/processor:${PROCESSOR_TAG}
      imagePullPolicy: IfNotPresent
      command: [python]
      source: |
        # `processing` is set before a MediaCloud lookup and cleared
        # after it, and nothing sets it back -- so a worker that dies
        # mid-call strands its article behind a flag describing a run
        # that ended months ago. Four were found in that state on
        # 2026-09-14, the oldest stuck ten months.
        #
        # `error` is the same failure with a different shape: never
        # retried, so a transient outage is permanent. All 15 in the
        # corpus fall in two windows, which is MediaCloud being down.
        from src.models.database import DatabaseManager
        from src.services.wire_detection.reclaim import reclaim_stranded
        moved = reclaim_stranded(DatabaseManager().engine)
        print(f"reclaimed {moved}")
      env: *db_env
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

  - name: anything-owed-step
    metadata:
      labels:
        stage: guard
        housekeeping: "true"
    script:
      image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/processor:${PROCESSOR_TAG}
      imagePullPolicy: IfNotPresent
      command: [python]
      source: |
        from sqlalchemy import text
        from src.models.database import DatabaseManager
        with DatabaseManager().get_session() as s:
            n = s.execute(text(
                "SELECT count(*) FROM pipeline_rework WHERE done_at IS NULL"
            )).scalar()
        print(n)
      env: *db_env
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
