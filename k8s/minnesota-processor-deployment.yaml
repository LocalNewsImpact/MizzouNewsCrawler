apiVersion: apps/v1
kind: Deployment
metadata:
  name: minnesota-processor
  namespace: production
  labels:
    app: minnesota-processor
    dataset: minnesota-news-sources
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minnesota-processor
  template:
    metadata:
      labels:
        app: minnesota-processor
        dataset: minnesota-news-sources
    spec:
      serviceAccountName: mizzou-app
      containers:
      - name: processor
        image: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler/processor:latest
        command:
          - python
          - orchestration/continuous_processor.py
        env:
        - name: PYTHONPATH
          value: "/app:/opt/origin-shim"
        # Database configuration
        - name: DATABASE_ENGINE
          value: "postgresql+psycopg2"
        - name: DATABASE_HOST
          value: "127.0.0.1"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: password
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: database
        - name: DATABASE_URL
          value: "$(DATABASE_ENGINE)://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
        # Cloud SQL Connector configuration
        - name: USE_CLOUD_SQL_CONNECTOR
          value: "true"
        - name: CLOUD_SQL_INSTANCE
          value: "mizzou-news-crawler:us-central1:mizzou-db-prod-ssd"
        - name: DATASET_FILTER
          value: "minnesota-news-sources"
        - name: MEDIACLOUD_ENABLED
          value: "false"
        - name: ENABLE_DISCOVERY
          value: "false"
        - name: ENABLE_VERIFICATION
          value: "false"
        - name: ENABLE_EXTRACTION
          value: "false"
        - name: ENABLE_CLEANING
          value: "true"
        - name: ENABLE_ML_ANALYSIS
          value: "true"
        - name: ENABLE_ENTITY_EXTRACTION
          value: "true"
        - name: ENABLE_WIRE_DETECTION
          value: "true"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            cpu: "1000m"
            memory: "4Gi"
          limits:
            cpu: "2000m"
            memory: "8Gi"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 60
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 10
          periodSeconds: 30
