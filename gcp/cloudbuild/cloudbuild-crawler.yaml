substitutions:
  _BASE_IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/mizzou-crawler/base:latest
  _REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/mizzou-crawler
  _RELEASE_VERSION: '1.3.1'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '--build-arg'
      - 'BASE_IMAGE=${_BASE_IMAGE}'
      - '-f'
      - 'Dockerfile.crawler'
      - '-t'
      - '${_REGISTRY}/crawler:${SHORT_SHA}'
      - '-t'
      - '${_REGISTRY}/crawler:latest'
      - '-t'
      - '${_REGISTRY}/crawler:v${_RELEASE_VERSION}'
      - '.'

  # This image is built FROM base:latest. If a base rebuild was still in flight
  # when that pull happened, the image is silently built on the PREVIOUS base
  # and ships without dependencies that were just added to requirements-base.txt
  # — the build still succeeds and the gap only appears at runtime. Fail here,
  # before anything is deployed, rather than in production.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'verify-dependencies'
    entrypoint: 'bash'
    waitFor: ['build']
    args:
      - '-c'
      - |
        docker run --rm -v /workspace:/repo:ro \
          '${_REGISTRY}/crawler:${SHORT_SHA}' \
          python /repo/scripts/verify_image_dependencies.py \
            /repo/requirements-base.txt /repo/requirements-crawler.txt

  # Get GKE credentials for kubectl commands
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-gke-credentials'
    waitFor: ['verify-dependencies']
    args:
      - 'container'
      - 'clusters'
      - 'get-credentials'
      - 'mizzou-cluster'
      - '--zone=us-central1-a'

  # Update CronJob image in production
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'update-crawler-cronjob'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=mizzou-cluster'
    args:
      - 'set'
      - 'image'
      - 'cronjob/mizzou-crawler'
      - 'crawler=${_REGISTRY}/crawler:${SHORT_SHA}'
      - '--namespace=production'
    waitFor: ['get-gke-credentials']

  # Update work-queue deployment image
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'update-work-queue'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=mizzou-cluster'
    args:
      - 'set'
      - 'image'
      - 'deployment/work-queue'
      - 'work-queue=${_REGISTRY}/crawler:${SHORT_SHA}'
      - '--namespace=production'
    waitFor: ['get-gke-credentials']

  # Update Argo WorkflowTemplate to use new crawler image SHA
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-argo-workflow-template'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${BRANCH_NAME}" = "main" ]; then
          echo "🔄 Updating Argo WorkflowTemplate with crawler:${SHORT_SHA}..."
          bash gcp/cloudbuild/update-workflow-template.sh crawler "${SHORT_SHA}" "${_REGISTRY}"
        else
          echo "ℹ️  Skipping Argo WorkflowTemplate update - not on main branch (${BRANCH_NAME})"
        fi
    waitFor: ['get-gke-credentials']

images:
  - '${_REGISTRY}/crawler:${SHORT_SHA}'
  - '${_REGISTRY}/crawler:v${_RELEASE_VERSION}'
  - '${_REGISTRY}/crawler:latest'
timeout: 1800s
options:
  machineType: 'N1_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
