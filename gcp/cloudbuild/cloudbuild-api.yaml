substitutions:
  _BASE_IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/mizzou-crawler/base:latest
  _REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/mizzou-crawler
  _RELEASE_VERSION: '1.3.1'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args:
      - 'build'
      - '--build-arg'
      - 'BASE_IMAGE=${_BASE_IMAGE}'
      - '-t'
      - '${_REGISTRY}/api:${SHORT_SHA}'
      - '-t'
      - '${_REGISTRY}/api:latest'
      - '-t'
      - '${_REGISTRY}/api:v${_RELEASE_VERSION}'
      - '-f'
      - 'Dockerfile.api'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGISTRY}/api'
    waitFor: ['build-api']

  # Built FROM base:latest — if a base rebuild was in flight when that pull
  # happened, this image is silently on the previous base and ships without
  # dependencies just added to requirements-base.txt. Fail before deploying.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'verify-dependencies'
    entrypoint: 'bash'
    waitFor: ['build-api']
    args:
      - '-c'
      - |
        docker run --rm -v /workspace:/repo:ro \
          '${_REGISTRY}/api:${SHORT_SHA}' \
          python /repo/scripts/verify_image_dependencies.py \
            /repo/requirements-base.txt /repo/requirements-api.txt

  # Force pod update by setting image directly
  # This is the fix - Cloud Deploy doesn't update hardcoded tags in YAML
  # kubectl set image modifies deployment spec -> triggers NEW ReplicaSet -> rolling update
  # No duplicate pods because new RS has different hash in pod names
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-gke-credentials'
    args:
      - 'container'
      - 'clusters'
      - 'get-credentials'
      - 'mizzou-cluster'
      - '--zone=us-central1-a'
    waitFor: ['push-api']

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'force-api-update'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=mizzou-cluster'
    args:
      - 'set'
      - 'image'
      - 'deployment/mizzou-api'
      - 'api=${_REGISTRY}/api:${SHORT_SHA}'
      - '--namespace=production'
    waitFor: ['get-gke-credentials']
  # The two proxy-health CronJobs run this image as well, and ran it as
  # `api:latest` -- the moving tag the content-hash scheme replaced
  # everywhere else. A moving tag makes "which code is checking the proxy"
  # unanswerable, and it is the check that says whether egress works at
  # all.
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'update-proxy-health-monitor'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=mizzou-cluster'
    args:
      - 'set'
      - 'image'
      - 'cronjob/proxy-health-monitor'
      - 'proxy-health-check=${_REGISTRY}/api:${SHORT_SHA}'
      - '--namespace=production'
    waitFor: ['get-gke-credentials']

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'update-proxy-health-all-nodes'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=mizzou-cluster'
    args:
      - 'set'
      - 'image'
      - 'cronjob/proxy-health-all-nodes'
      - 'proxy-check=${_REGISTRY}/api:${SHORT_SHA}'
      - '--namespace=production'
    waitFor: ['get-gke-credentials']
images:
  - '${_REGISTRY}/api:${SHORT_SHA}'
  - '${_REGISTRY}/api:v${_RELEASE_VERSION}'
timeout: 1800s
options:
  machineType: 'N1_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
