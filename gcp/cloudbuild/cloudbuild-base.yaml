# The dependency layer every service is built on.
#
# Tagged by a hash of what goes into it, computed by the shared action
# (LocalNewsImpact/lnic-contracts .github/actions/image-tag) and passed in
# as _TAG. `:latest` is also moved here, because 46 references across this
# repository still resolve by it; nothing new should.
#
# Built by .github/workflows/base-images.yml, which builds it only when no
# image for these contents exists.

substitutions:
  _TAG: ""
  # Braced, and only braced: inside a user-defined substitution Cloud
  # Build expands ${PROJECT_ID} and passes a bare $PROJECT_ID through to
  # the shell unexpanded, where `set -u` stops the build at step 0.
  # That is how every tagged build failed from 2026-09-04 to 2026-09-05.
  _REGISTRY: "us-central1-docker.pkg.dev/${PROJECT_ID}/mizzou-crawler"

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-base'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        # Refused rather than defaulted: an image tagged with nothing, or
        # with a tag this build invented, is the failure the content hash
        # exists to remove.
        if [ -z "${_TAG}" ]; then
          echo "_TAG is unset. .github/workflows/base-images.yml computes it"
          echo "with the shared image-tag action and passes it in."
          exit 1
        fi
        docker build \
          -t "${_REGISTRY}/base:${_TAG}" \
          -t "${_REGISTRY}/base:latest" \
          -f Dockerfile.base .
        docker push "${_REGISTRY}/base:${_TAG}"
        docker push "${_REGISTRY}/base:latest"

timeout: 1800s

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
