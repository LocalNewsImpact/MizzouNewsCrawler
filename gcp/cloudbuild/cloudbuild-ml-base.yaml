# The ML dependency layer: the production base plus torch, transformers
# and the model.
#
# Tagged by a hash of what goes into it, and the base image's tag is part
# of that hash (.github/workflows/base-images.yml). A base that changes
# gives this image a tag that does not exist yet, so it is rebuilt --
# which is what nothing did for ci-base between 18 July and 3 September.
#
# `:latest` is also moved, because references across this repository still
# resolve by it. Nothing new should.

substitutions:
  _TAG: ""
  _BASE_IMAGE: ""
  _REGISTRY: "us-central1-docker.pkg.dev/$PROJECT_ID/mizzou-crawler"

steps:
  # The model is 418MB and lives in GCS rather than git. Its absence is
  # not fatal here -- the image builds without it and the service falls
  # back -- so this does not fail the build.
  - id: 'download-model'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p models
        gsutil cp gs://mizzou-news-crawler-models/productionmodel.pt \
          models/productionmodel.pt || echo "no model in GCS; building without it"

  - id: 'build-ml-base'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    waitFor: ['download-model']
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ -z "${_TAG}" ] || [ -z "${_BASE_IMAGE}" ]; then
          echo "_TAG and _BASE_IMAGE are both required."
          echo ".github/workflows/base-images.yml computes them with the"
          echo "shared image-tag action and passes them in."
          exit 1
        fi
        docker pull "${_BASE_IMAGE}"
        docker build \
          --build-arg "BASE_IMAGE=${_BASE_IMAGE}" \
          -t "${_REGISTRY}/ml-base:${_TAG}" \
          -t "${_REGISTRY}/ml-base:latest" \
          -f Dockerfile.ml-base .
        docker push "${_REGISTRY}/ml-base:${_TAG}"
        docker push "${_REGISTRY}/ml-base:latest"

timeout: '3600s'  # ML packages take time to install

# No `images:` block. The build pushes what it built, by the tag it was
# given; listing tags here would push a ${SHORT_SHA} and a v1.0.0 that
# say nothing about what is in the image, which is what tagging by
# contents replaces.

tags:
  - 'ml-base'
  - 'infrastructure'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
