substitutions:
  _ML_BASE_IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/mizzou-crawler/ml-base:latest
  _REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/mizzou-crawler
  _RELEASE_VERSION: '1.3.1'

steps:
  # Warm build cache from the last pushed image (non-fatal if missing)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'warm-cache'
    entrypoint: 'bash'
    args:
      - '-lc'
      - |
        docker pull ${_REGISTRY}/processor:latest || true
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-processor'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--build-arg'
      - 'ML_BASE_IMAGE=${_ML_BASE_IMAGE}'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '--cache-from'
      - '${_REGISTRY}/processor:latest'
      - '-f'
      - 'Dockerfile.processor'
      - '-t'
      - '${_REGISTRY}/processor:${SHORT_SHA}'
      - '-t'
      - '${_REGISTRY}/processor:latest'
      - '-t'
      - '${_REGISTRY}/processor:v${_RELEASE_VERSION}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-processor'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGISTRY}/processor'
    waitFor:
      - 'build-processor'

  # Built FROM ml-base:latest (itself FROM base) — if either rebuild was in
  # flight when that pull happened, this image is silently on the previous base
  # and ships without dependencies just added to requirements. Fail before
  # deploying rather than discovering it at runtime.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'verify-dependencies'
    entrypoint: 'bash'
    waitFor:
      - 'build-processor'
    args:
      - '-c'
      - |
        docker run --rm -v /workspace:/repo:ro \
          '${_REGISTRY}/processor:${SHORT_SHA}' \
          python /repo/scripts/verify_image_dependencies.py \
            /repo/requirements-base.txt /repo/requirements-processor.txt

  # Force pod update by setting image directly
  # This is the fix - Cloud Deploy doesn't update hardcoded tags in YAML
  # kubectl set image modifies deployment spec -> triggers NEW ReplicaSet -> rolling update
  # No duplicate pods because new RS has different hash in pod names
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-gke-credentials'
    args:
      - 'container'
      - 'clusters'
      - 'get-credentials'
      - 'mizzou-cluster'
      - '--zone=us-central1-a'
    waitFor: ['push-processor']

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'force-processor-update'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=mizzou-cluster'
    args:
      - 'set'
      - 'image'
      - 'deployment/mizzou-processor'
      - 'processor=${_REGISTRY}/processor:${SHORT_SHA}'
      - '--namespace=production'
    waitFor: ['get-gke-credentials']

  # Update CLI deployment image
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'update-cli-deployment'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=mizzou-cluster'
    args:
      - 'set'
      - 'image'
      - 'deployment/mizzou-cli'
      - 'cli=${_REGISTRY}/processor:${SHORT_SHA}'
      - '--namespace=production'
    waitFor: ['get-gke-credentials']

  # Force a rollout restart to ensure new image is pulled
  # This handles case where same tag has new image digest
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'restart-processor'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=mizzou-cluster'
    args:
      - 'rollout'
      - 'restart'
      - 'deployment/mizzou-processor'
      - '--namespace=production'
    waitFor: ['force-processor-update']

  # Update Argo WorkflowTemplate to use new processor image SHA
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-argo-workflow-template'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # NOT gated on BRANCH_NAME. CI/CD invokes this trigger as
        # `gcloud builds triggers run build-processor-manual --sha=<sha>`, and a
        # run started by SHA leaves BRANCH_NAME empty -- so this step took the
        # "not on main" path on EVERY deploy and the WorkflowTemplate silently
        # never updated. Live proof 2026-07-28: Deployments were on 60872f7
        # while the template still ran 2bc05a2, i.e. extraction would have kept
        # using the previous image. Every other deploy step in this file
        # (update-work-queue, the cronjob) is ungated and repoints production
        # already; this one was the odd one out.
        echo "🔄 Updating Argo WorkflowTemplate with processor:${SHORT_SHA}..."
        bash gcp/cloudbuild/update-workflow-template.sh processor "${SHORT_SHA}" "${_REGISTRY}"
    waitFor: ['get-gke-credentials']

images:
  - '${_REGISTRY}/processor:${SHORT_SHA}'
  - '${_REGISTRY}/processor:v${_RELEASE_VERSION}'
timeout: 1800s
options:
  machineType: 'N1_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
