# Keep the base images in step with what the repository pins.
#
# THE FAILURE THIS EXISTS FOR
# ---------------------------
# ci-base:latest was built on 18 July and base:latest on 3 September.
# Nothing rebuilt one when the other changed and nothing compared them, so
# CI ran for seven weeks inside an image that could not hold what the
# commits pinned. It surfaced as a hundred collection errors in three
# jobs, none of which named the cause, and a pull request was merged with
# them failing.
#
# HOW THE CHAIN WORKS
# -------------------
# Each image is tagged with a hash of what goes into it, and a child's
# hash includes its parent's tag:
#
#   base     = hash(Dockerfile.base, requirements-base.txt)
#   ml-base  = hash(Dockerfile.ml-base, requirements-ml.txt, base tag)
#   ci-base  = hash(Dockerfile.ci-base, the requirements it installs, base tag)
#
# So a base that changes gives its children tags that do not exist yet,
# and they are built. Going stale stops being something a person has to
# notice.
#
# The tag is computed by the action shared across the suite
# (LocalNewsImpact/lnic-contracts), so every repository computes it the
# same way. The build runs in Cloud Build, because these images are 1.4
# to 10 GB from a 6.4 GB context and do not fit on a runner.
#
# WHO RUNS IT
# -----------
# build-and-deploy-services.yml calls this on every push to main, ahead
# of the service builds, which are FROM these images. It has no push
# trigger of its own: two runs for one push would each find the image
# missing and each build it. Each job waits for its Cloud Build to finish
# -- `gcloud builds triggers run` returns when the build is queued, and
# the first version of this workflow took that for done, so ml-base and
# ci-base pulled a base that was still being built and the run was green
# while every build behind it failed.
#
# The caller's concurrency group serialises this with the rest of the
# deploy. A manual dispatch has no such group and runs alongside whatever
# is in flight; `force` is for refreshing an upstream layer (the python
# image, an OS package) that the hash cannot see.
name: Base images

on:
  workflow_call:
    inputs:
      force:
        description: Rebuild every image, even one that exists for these contents.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every image, even one that exists for these contents.
        type: boolean
        default: false

env:
  PROJECT_ID: mizzou-news-crawler
  REGISTRY: us-central1-docker.pkg.dev/mizzou-news-crawler/mizzou-crawler

jobs:
  base:
    name: base
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # The key this repository's other deploy workflows use. Workload
      # identity would be better and is not what is configured here;
      # inventing a second auth path in this change would be a second
      # thing to get wrong.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - id: tag
        uses: LocalNewsImpact/lnic-contracts/.github/actions/image-tag@ci-v1
        with:
          image: ${{ env.REGISTRY }}/base
          dockerfile: Dockerfile.base
          inputs_to_hash: |
            requirements-base.txt

      # Through the manual trigger, not `gcloud builds submit`.
      #
      # The triggers read their config from git (gitFileSource:
      # gcp/cloudbuild/cloudbuild-base.yaml on refs/heads/main), so the
      # build being run is the one in this repository and reviewable in a
      # pull request. `builds submit` uploads a source tarball instead,
      # and the service account this workflow authenticates as cannot
      # write to the Cloud Build source bucket -- which is what the first
      # run of this workflow failed on.
      - name: Build it, if there is no image for these contents
        if: steps.tag.outputs.exists == 'false' || inputs.force
        run: >-
          scripts/ci/run-cloud-build-trigger.sh build-base-manual "${{ github.sha }}"
          "_TAG=${{ steps.tag.outputs.tag }}"

  ml-base:
    name: ml-base
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - id: tag
        uses: LocalNewsImpact/lnic-contracts/.github/actions/image-tag@ci-v1
        with:
          image: ${{ env.REGISTRY }}/ml-base
          dockerfile: Dockerfile.ml-base
          inputs_to_hash: |
            requirements-ml.txt
          # The parent's tag, so a base that changes rebuilds this.
          build_args: |
            BASE_IMAGE=${{ needs.base.outputs.image }}

      # The trigger carries `_BASE_IMAGE=...base:latest` as a default,
      # which is the thing this chain replaces. Passing it here overrides
      # it for the run.
      - name: Build it, if there is no image for these contents
        if: steps.tag.outputs.exists == 'false' || inputs.force
        run: >-
          scripts/ci/run-cloud-build-trigger.sh build-ml-base-manual "${{ github.sha }}"
          "_TAG=${{ steps.tag.outputs.tag }},_BASE_IMAGE=${{ needs.base.outputs.image }}"

  ci-base:
    name: ci-base
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - id: tag
        uses: LocalNewsImpact/lnic-contracts/.github/actions/image-tag@ci-v1
        with:
          image: ${{ env.REGISTRY }}/ci-base
          dockerfile: Dockerfile.ci-base
          # Everything Dockerfile.ci-base installs. This image carries
          # every service's requirements so tests exercise the real
          # dependency set rather than a subset.
          inputs_to_hash: |
            requirements-dev.txt
            requirements-crawler.txt
            requirements-processor.txt
            requirements-api.txt
          build_args: |
            BASE_IMAGE=${{ needs.base.outputs.image }}

      - name: Build it, if there is no image for these contents
        id: build
        if: steps.tag.outputs.exists == 'false' || inputs.force
        run: >-
          scripts/ci/run-cloud-build-trigger.sh build-ci-base-manual "${{ github.sha }}"
          "_TAG=${{ steps.tag.outputs.tag }},_BASE_IMAGE=${{ needs.base.outputs.image }}"

      # CI pulls this from GHCR, not from Artifact Registry: pulling a
      # multi-GB image to a GitHub runner costs $0.35-0.50 in egress each
      # time. A rebuilt image that is not mirrored is a rebuilt image CI
      # never sees, which is half of the original failure. Only after the
      # build has finished: mirroring before it lands re-mirrors the old
      # image under the same name.
      - name: Mirror it to where CI pulls from
        if: steps.build.outcome == 'success'
        run: gh workflow run "Mirror CI Images to GHCR" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
