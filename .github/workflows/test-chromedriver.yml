name: Test ChromeDriver Installation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Dockerfile.crawler'
      - '.github/workflows/test-chromedriver.yml'
  workflow_dispatch: {}

# Only run on PRs that actually modify the Crawler Dockerfile or this workflow
# This prevents unnecessary runs on every PR

jobs:
  test-apt-packages:
    name: Test APT Package Installation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Google Chrome and matching ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg unzip curl
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)
          DRIVER_VERSION=$(curl -sS https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_MAJOR})
          wget -q -O /tmp/chromedriver.zip https://chromedriver.storage.googleapis.com/${DRIVER_VERSION}/chromedriver_linux64.zip
          unzip /tmp/chromedriver.zip -d /usr/local/bin
          chmod +x /usr/local/bin/chromedriver
          sudo ln -sf /usr/local/bin/chromedriver /usr/bin/chromedriver
      
      - name: Verify versions match
        run: |
          echo "=== Google Chrome ==="
          google-chrome --version
          
          echo ""
          echo "=== ChromeDriver ==="
          chromedriver --version
          
          echo ""
          echo "=== Version Check ==="
          CHROME_MAJOR=$(chromium --version | grep -oP '\d+' | head -1)
          DRIVER_MAJOR=$(chromedriver --version | grep -oP '\d+' | head -1)
          
          echo "Chrome major: $CHROME_MAJOR"
          echo "Driver major: $DRIVER_MAJOR"
          
          if [ "$CHROME_MAJOR" = "$DRIVER_MAJOR" ]; then
            echo "✅ SUCCESS: Versions match!"
          else
            echo "❌ FAIL: Version mismatch (Chrome $CHROME_MAJOR vs Driver $DRIVER_MAJOR)"
            exit 1
          fi
      
      - name: Test Selenium
        run: |
          pip install --quiet selenium
          python3 << 'PYEOF'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")

          service = Service("/usr/bin/chromedriver")

          try:
              driver = webdriver.Chrome(service=service, options=options)
              print("✅ Selenium works with APT packages!")
              driver.quit()
          except Exception as e:
              print(f"❌ Selenium failed: {e}")
              exit(1)
          PYEOF

  test-chromedriver-docker:
    name: Test ChromeDriver in Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build test image
        run: |
          cat > /tmp/Dockerfile.chromedriver-test <<'EOF'
          FROM python:3.11-slim
          
          # Install Google Chrome and matching ChromeDriver (for CI diagnostic)
          RUN apt-get clean && \
              rm -rf /var/lib/apt/lists/* && \
              apt-get update && \
              apt-get install -y --no-install-recommends wget ca-certificates gnupg unzip curl fonts-liberation libnss3 libxss1 xdg-utils libxdamage1 libx11-xcb1 && \
              wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | apt-key add - && \
              sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list' && \
              apt-get update && apt-get install -y --no-install-recommends google-chrome-stable && \
              CHROME_VERSION=$(google-chrome --version | awk '{print $3}') && \
              CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1) && \
              CHROMEDRIVER_VERSION=$(curl -sS https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_MAJOR}) && \
              wget -q -O /tmp/chromedriver_linux64.zip https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip && \
              unzip /tmp/chromedriver_linux64.zip -d /usr/local/bin && chmod +x /usr/local/bin/chromedriver && ln -sf /usr/local/bin/chromedriver /usr/bin/chromedriver && \
              rm -rf /var/lib/apt/lists/* && \
              mkdir -p /opt/chromedriver-cache /home/appuser/.wdm && \
              chmod 777 /opt/chromedriver-cache /home/appuser/.wdm && \
              echo "Google Chrome version: $(google-chrome --version)" && \
              echo "ChromeDriver version: $(chromedriver --version)"
          
          CMD ["/bin/bash"]
          EOF
          
          docker build -f /tmp/Dockerfile.chromedriver-test -t chromedriver-test:ci .
      
      - name: Verify versions in container
        run: |
          docker run --rm chromedriver-test:ci bash -c '
            echo "=== Google Chrome ==="
            google-chrome --version

            echo ""
            echo "=== ChromeDriver ==="
            chromedriver --version

            echo ""
            echo "=== Compatibility Check ==="
            CHROME_MAJOR=$(google-chrome --version | grep -oP "\\d+" | head -1)
            DRIVER_MAJOR=$(chromedriver --version | grep -oP "\\d+" | head -1)

            echo "Chrome major: $CHROME_MAJOR"
            echo "Driver major: $DRIVER_MAJOR"

            if [ "$CHROME_MAJOR" = "$DRIVER_MAJOR" ]; then
              echo "✅ PASS: Versions match exactly!"
            else
              echo "❌ FAIL: Version mismatch"
              exit 1
            fi
          '

      - name: Run UA metadata diagnostic in container
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace chromedriver-test:ci bash -lc '
            pip install --no-cache-dir undetected-chromedriver
            python3 scripts/diagnose_user_agent_metadata.py > /tmp/diag.json || true
            python3 - <<PY
import json,sys
r=json.load(open("/tmp/diag.json"))
for e in r:
    if e.get("test")=="full_payload":
        if not e.get("ok"):
            print("❌ full_payload not accepted")
            sys.exit(1)
print("✅ full_payload accepted")
PY
          '

      
      - name: Test Selenium initialization
        run: |
          docker run --rm chromedriver-test:ci bash << 'TESTEOF'
          pip install --quiet selenium
          python3 << 'PYEOF'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")

          service = Service("/usr/bin/chromedriver")

          try:
              driver = webdriver.Chrome(service=service, options=options)
              print("✅ Selenium initialized successfully")
              driver.quit()
          except Exception as e:
              print(f"❌ Selenium failed: {e}")
              exit(1)
          PYEOF
          TESTEOF
