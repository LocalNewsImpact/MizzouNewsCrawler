name: Staging Rollout (manual)

on:
  workflow_dispatch:
    inputs:
      gcp-project:
        description: 'GCP project ID for Artifact Registry / GKE'
        required: true
      artifact-repo:
        description: 'Artifact Registry repo (e.g., us-central1-docker.pkg.dev/<project>/mizzou-news-crawler)'
        required: true
      image-tag:
        description: 'Image tag to push (defaults to the commit SHA)'
        required: false
      staging-namespace:
        description: 'Kubernetes namespace for staging'
        required: true
      k8s-deployment:
        description: 'K8s deployment name to update in staging'
        required: true

jobs:
  # Gate on the GCP_SA_KEY secret. This can't be done in a job-level `if:`
  # (the `secrets` context is not allowed there — doing so is a validation error
  # that makes the whole file a startup_failure on every push). Read it in a
  # step's env instead and expose the result as an output the deploy job gates on.
  check-credentials:
    name: Check credentials configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP_SA_KEY secret not set — skipping staging rollout."
          fi

  build-and-push:
    name: Build and push image to Artifact Registry (staging)
    needs: check-credentials
    runs-on: ubuntu-latest
    if: ${{ needs.check-credentials.outputs.configured == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ inputs.gcp-project }}
          # kubectl against modern GKE needs the auth plugin (not bundled by default)
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker

      - name: Build Docker image
        run: |
          TAG=${{ inputs.image-tag }}
          : ${TAG:=${{ github.sha }}}
          IMAGE=${{ inputs.artifact-repo }}:${TAG}
          docker build -f Dockerfile.crawler -t ${IMAGE} .
          docker push ${IMAGE}
        env:
          CLOUDSDK_CORE_PROJECT: ${{ inputs.gcp-project }}

      - name: Deploy to GKE staging (update image)
        run: |
          TAG=${{ inputs.image-tag }}
          : ${TAG:=${{ github.sha }}}
          IMAGE=${{ inputs.artifact-repo }}:${TAG}

          # get credentials for cluster via gcloud (assumes cluster and region preconfigured in project)
          # NOTE: replace these env vars with your cluster name/region or add inputs to the workflow
          : ${CLUSTER_NAME:=${{ secrets.STAGING_CLUSTER_NAME }}}
          : ${CLUSTER_REGION:=${{ secrets.STAGING_CLUSTER_REGION }}}

          gcloud container clusters get-credentials ${CLUSTER_NAME} --region ${CLUSTER_REGION} --project ${{ inputs.gcp-project }}

          # update the deployment image in the staging namespace
          kubectl -n ${{ inputs.staging-namespace }} set image deployment/${{ inputs.k8s-deployment }} *=${IMAGE}

      - name: Run quick probe against staging (headful check)
        run: |
          TAG=${{ inputs.image-tag }}
          : ${TAG:=${{ github.sha }}}
          IMAGE=${{ inputs.artifact-repo }}:${TAG}

          echo "Manual step: run a headful probe against a known staging URL to validate UA/client-hints & PX acceptance."
          echo "Use the probe script locally or exec into a staging pod to run it."

    permissions:
      contents: read

  notify:
    name: Notify (manual follow-up)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Post status
        run: |
          echo "Staging rollout completed (or queued). Please run probe and verify behaviour manually via the staging pod."
