name: Dependency Submission

on:
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
      - 'Pipfile'
      - 'Pipfile.lock'
  schedule:
    # Run weekly on Monday at 3am UTC to catch new vulnerabilities
    - cron: '0 3 * * 1'
  workflow_dispatch: {}  # Allow manual trigger

jobs:
  submit-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for dependency submission

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          # No cache. This job is the only thing in the repository that
          # pip-installs on a runner, and what it downloads is 2.9 GB --
          # a third of the repository's 10 GB cache budget, held for a
          # job that runs once a week. It was also the entry every pull
          # request restored and re-saved under its own key until the
          # budget overflowed and the checks went red.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Generate dependency snapshot
        run: |
          pip install pip-licenses
          pip list --format=freeze > installed-dependencies.txt

      - name: Submit dependencies to GitHub
        uses: advanced-security/component-detection-dependency-submission-action@v0.1.4
