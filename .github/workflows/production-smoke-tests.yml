name: Production Smoke Tests

on:
  # Run after successful deployments
  workflow_run:
    workflows: ["Build and Deploy Services"]
    types:
      - completed
    branches:
      - main

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter (e.g., TestSectionURLExtraction)'
        required: false
        default: ''

jobs:
  smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    # Only run if deployment succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          # kubectl against modern GKE needs the auth plugin (not bundled by default):
          # "exec: executable gke-gcloud-auth-plugin not found"
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials mizzou-cluster \
            --zone us-central1-a

      - name: Wait for deployments to be ready
        id: wait_ready
        run: |
          echo "⏳ Verifying deployments are healthy and ready..."
          echo ""

          TIMEOUT=600  # 10 minutes
          SERVICES=(mizzou-api mizzou-processor work-queue)

          # Production is sometimes deliberately scaled to zero between crawl
          # waves. If EVERY service has 0 desired replicas, that's a pause,
          # not a failure — skip the smoke tests with a notice. (A mixed
          # state — some scaled up, some not — still fails below, since
          # rollout status on the scaled-up ones must succeed.)
          TOTAL_DESIRED=0
          for service in "${SERVICES[@]}"; do
            desired=$(kubectl get deployment/$service -n production \
              -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 0)
            TOTAL_DESIRED=$((TOTAL_DESIRED + ${desired:-0}))
          done
          if [ "$TOTAL_DESIRED" -eq 0 ]; then
            echo "::notice::Production is scaled to zero (all deployments have 0 desired replicas) — skipping smoke tests."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          for service in "${SERVICES[@]}"; do
            echo "Checking $service deployment..."
            if ! kubectl rollout status deployment/$service -n production --timeout=${TIMEOUT}s; then
              echo "❌ $service deployment failed to become ready"
              echo ""
              echo "Pod status:"
              kubectl get pods -n production -l app=$service
              echo ""
              echo "Recent pod events:"
              kubectl describe pods -n production -l app=$service | grep -A 20 "Events:"
              exit 1
            fi
            echo "✅ $service is ready"
          done

          echo ""
          echo "⏳ Waiting additional 30 seconds for service stabilization..."
          sleep 30

          # Verify no pods are in CrashLoopBackOff
          echo ""
          echo "Verifying pod health..."
          CRASH_PODS=$(kubectl get pods -n production \
            -o jsonpath='{range .items[*]}{.metadata.name},{.status.containerStatuses[*].state.waiting.reason}{"\n"}{end}' | \
            grep CrashLoopBackOff | wc -l)

          if [ "$CRASH_PODS" -gt 0 ]; then
            echo "❌ Found pods in CrashLoopBackOff state"
            kubectl get pods -n production -o wide
            exit 1
          fi

          echo "✅ All pods are healthy"

      - name: Run smoke tests
        id: smoke_tests
        if: steps.wait_ready.outputs.skip != 'true'
        run: |
          echo "🧪 Running production smoke tests..."
          echo ""

          # Get processor pod
          POD_NAME=$(kubectl get pods -n production -l app=mizzou-processor -o jsonpath='{.items[0].metadata.name}')

          if [ -z "$POD_NAME" ]; then
            echo "❌ No processor pod found"
            kubectl get pods -n production
            exit 1
          fi

          echo "Using pod: $POD_NAME"

          # Verify pod is actually running (not just ready)
          POD_STATUS=$(kubectl get pod "$POD_NAME" -n production -o jsonpath='{.status.phase}')
          if [ "$POD_STATUS" != "Running" ]; then
            echo "❌ Pod is in state: $POD_STATUS (expected Running)"
            kubectl describe pod "$POD_NAME" -n production
            exit 1
          fi

          # Quick connectivity check
          echo "Checking pod connectivity..."
          if ! kubectl exec -n production "$POD_NAME" -- bash -c "echo 'OK'"; then
            echo "❌ Pod is not responding to commands"
            exit 1
          fi
          echo "✅ Pod is responding"

          echo ""
          echo "Running test suite..."

          # The production image ships src/ but (correctly) not tests/, so
          # copy the smoke test from this checkout into the pod. This also
          # means each run tests the repo-current version of the test file.
          kubectl cp tests/e2e/test_production_smoke.py \
            "production/$POD_NAME:/tmp/test_production_smoke.py"

          # Freshness assertions -- URLs discovered in the last day, telemetry
          # in the last hour -- only mean something while collection runs.
          # Ask Kubernetes whether the crawler is suspended and let the tests
          # skip those checks with a reason rather than failing for one.
          COLLECTION_SUSPENDED=$(kubectl get cronjob mizzou-crawler -n production \
            -o jsonpath='{.spec.suspend}' 2>/dev/null || echo "")
          if [ "$COLLECTION_SUSPENDED" = "true" ]; then
            echo "ℹ️  Collection is suspended; freshness checks will skip."
          else
            COLLECTION_SUSPENDED="false"
          fi

          # Build pytest command. `cd /app && python -m pytest` puts /app on
          # sys.path so the test's `from src.models...` imports resolve.
          PYTEST_CMD="cd /app && COLLECTION_SUSPENDED=$COLLECTION_SUSPENDED python -m pytest /tmp/test_production_smoke.py -v --tb=short --color=yes -p no:cacheprovider"

          # Add test filter if provided
          if [ -n "${{ github.event.inputs.test_filter }}" ]; then
            PYTEST_CMD="$PYTEST_CMD -k ${{ github.event.inputs.test_filter }}"
          fi

          # Run tests with timeout, teeing output so Report results can list
          # exactly which tests failed.
          set -o pipefail
          timeout 600 kubectl exec -n production "$POD_NAME" -- bash -c "$PYTEST_CMD" \
            | tee /tmp/smoke-output.log
          TEST_RESULT=$?
          set +o pipefail

          if [ $TEST_RESULT -eq 124 ]; then
            echo "❌ Tests timed out after 10 minutes"
            exit 1
          elif [ $TEST_RESULT -ne 0 ]; then
            echo "❌ Tests failed with exit code $TEST_RESULT"
            exit 1
          fi

      - name: Report results
        if: always()
        run: |
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          if [ "${{ steps.wait_ready.outputs.skip }}" == "true" ]; then
            summary "⏸️  Production scaled to zero — smoke tests skipped (not a failure)."
            exit 0
          fi

          # Per-test tallies from the captured pytest output
          if [ -f /tmp/smoke-output.log ]; then
            TALLY=$(grep -E "^[0-9]+ (passed|failed)|passed|failed" /tmp/smoke-output.log | tail -1)
            summary "## Production smoke tests"
            summary ""
            summary "**Result line:** \`${TALLY:-unavailable}\`"
            FAILED_TESTS=$(grep -E "^FAILED " /tmp/smoke-output.log | sed 's/^FAILED /- /' || true)
            if [ -n "$FAILED_TESTS" ]; then
              summary ""
              summary "### Failed tests"
              summary "$FAILED_TESTS"
              summary ""
              summary "### Failure reasons"
              grep -E "AssertionError|DatabaseError|Error:" /tmp/smoke-output.log \
                | grep -vE "^\s*(E\s+\||raise )" | sort -u | head -25 \
                | sed 's/^/- /' | tee -a "$GITHUB_STEP_SUMMARY" || true
            fi
          fi

          if [ "${{ steps.smoke_tests.outcome }}" == "success" ]; then
            summary "✅ All smoke tests passed!"
          else
            summary "❌ Smoke tests failed — see the list above."
            exit 1
          fi
