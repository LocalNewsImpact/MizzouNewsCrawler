name: CI

# CI workflow for MizzouNewsCrawler
#
# quick-checks-integration job: runs a focused Alembic/Postgres integration test
# (resync migration) against a PostgreSQL instance. This job is gated on the
# repository secret `TEST_DATABASE_URL` (CI-managed DB) to avoid accidental runs
# on forks or feature branches. It may also be manually dispatched on `main`.
# The job uses a service container (postgres:15) on GitHub-hosted runners, or
# can be triggered with TEST_DATABASE_URL env pointing to an external DB.

on:
  # Removed push to main - redundant since branch protection requires PR + passing CI
  # No need to run tests again after merge when they already passed on the PR
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main  # Run CI on PRs to main branch
  schedule:
    # Run stress job weekly at 03:00 UTC on Sundays (example)
    - cron: '0 3 * * 0'
  workflow_dispatch: {}  # Allow manual runs on main if needed

jobs:
  # Detect whether this PR touches anything other than CI workflows and docs.
  # The heavy jobs below gate on `code == 'true'`, so a workflow-only or
  # docs-only PR skips them. A job skipped via `if:` reports success, so the
  # required status checks are still satisfied. (A trigger-level `paths` filter
  # would instead leave required checks pending forever and block the merge —
  # hence per-job gating.)
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Non-PR event (or missing SHAs) — running full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "images=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mb=$(git merge-base "$base" "$head" 2>/dev/null || echo "")
          if [ -z "$mb" ]; then
            echo "No merge-base found — running full suite to be safe."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "images=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$mb" "$head")
          echo "Changed files:"
          echo "$changed"
          # Anything that is NOT a workflow file, docs/, *.md, or the local
          # git-hook installer counts as code. (setup-hooks.sh only defines the
          # pre-push hook — it's never imported by src/ or tests/.)
          code_files=$(echo "$changed" | grep -vE '^(\.github/workflows/|docs/|scripts/setup-hooks\.sh$)' | grep -vE '\.md$' || true)
          if [ -n "$code_files" ]; then
            echo "→ code changes present; running full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ only workflow/docs changes; skipping heavy test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          # Which container images does this PR's diff affect? Dockerfiles are
          # never built by the regular PR jobs (they run in PREBUILT images),
          # so image changes get a dedicated build+smoke via image-build-check.
          images=""
          add() { case ",$images," in *",$1,"*) ;; *) images="${images:+$images,}$1";; esac; }
          while IFS= read -r f; do
            case "$f" in
              Dockerfile.base|requirements-base.txt|requirements.txt) add base ;;
              Dockerfile.ml-base|requirements-ml.txt) add ml-base ;;
              Dockerfile.ci-base|requirements-dev.txt) add ci-base ;;
              Dockerfile.processor|requirements-processor.txt) add processor ;;
              Dockerfile.crawler|requirements-crawler.txt) add crawler ;;
              Dockerfile.api|requirements-api.txt|backend/*) add api ;;
              Dockerfile.migrator|requirements-migrator.txt) add migrator ;;
            esac
          done <<< "$changed"
          echo "→ images affected: ${images:-none}"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # PR CI runs tests INSIDE prebuilt images, so a PR that edits a Dockerfile
  # or requirements file is never actually built here — the change would first
  # execute in the post-merge production build. This job closes that gap:
  # build the affected image(s) from the PR source in Cloud Build with a
  # throwaway tag (nothing pushed) and smoke-test inside the fresh build.
  image-build-check:
    name: Image Build Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.images != ''
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build + smoke affected images from PR source
        run: |
          echo "Images affected by this PR: ${{ needs.changes.outputs.images }}"
          set +e
          gcloud builds submit \
            --config gcp/cloudbuild/cloudbuild-pr-image-check.yaml \
            --substitutions "^~^_IMAGES=${{ needs.changes.outputs.images }}" \
            --project mizzou-news-crawler \
            --gcs-source-staging-dir gs://mizzou-news-crawler-pr-staging/source \
            . 2>&1 | tee submit.log
          status=${PIPESTATUS[0]}
          set -e
          # The build logs to Cloud Logging only, so gcloud can't stream them
          # here — without this fetch a failure shows nothing but "status 1".
          build_id=$(grep -oE 'builds/[a-f0-9-]{36}' submit.log | head -1 | cut -d/ -f2)
          if [ -n "$build_id" ]; then
            gcloud builds log "$build_id" --project mizzou-news-crawler 2>/dev/null \
              | sed 's/^Step #[0-9]* - "build-and-smoke": //' > build.log
            echo ""
            echo "════════ Cloud Build log (build $build_id) ════════"
            cat build.log

            # Per-PR visibility: markdown summary on the job page with each
            # image's build/smoke/contract outcome, plus ::error:: annotations
            # so contract failures surface directly on the PR.
            {
              echo "## Image Build Check — build \`$build_id\`"
              echo ""
              if [ "$status" -eq 0 ]; then
                echo "**✅ SUCCESS** — all affected images built, smoked, and passed dependency contracts."
              else
                echo "**❌ FAILURE** — see annotations and log below."
              fi
              echo ""
              echo "| Image | Stage reached | Contracts verdict |"
              echo "|---|---|---|"
              awk '
                /^🔨 Building /       {img=$3; built[img]="built"; stage[img]="build"}
                /^🧪 Smoke: /         {stage[$3]="smoke"}
                /^📜 Dependency contracts: / {cur=$4; stage[cur]="contracts"}
                /(passed|failed|no tests ran)/ && cur {verdict[cur]=$0; cur=""}
                END {
                  for (i in built)
                    printf("| %s | %s | %s |\n", i, stage[i], (i in verdict ? verdict[i] : "—"))
                }' build.log
              echo ""
              echo "Full log: [Cloud Build console](https://console.cloud.google.com/cloud-build/builds/$build_id?project=mizzou-news-crawler)"
            } >> "$GITHUB_STEP_SUMMARY"

            grep -E "^FAILED |ERROR:" build.log | head -10 | while IFS= read -r line; do
              echo "::error title=Image Build Check::$line"
            done
          fi
          exit "$status"

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Run linting in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "
              git config --global --add safe.directory /workspace &&
              python -m ruff check . &&
              python -m black --check src/ tests/ web/ &&
              python -m isort --check-only --profile black src/ tests/ web/ &&
              (python -m mypy src/ --ignore-missing-imports || true)
            "
            # NOTE: only mypy is advisory here (the strict gate is the separate
            # mypy-strict job). Without the parentheses the trailing '|| true'
            # rescued the WHOLE && chain, so ruff/black/isort could never fail
            # this job — black had been printing failures into green runs.

      - name: Validate deployment configurations
        run: |
          echo "Validating k8s deployment YAML..."

          # Verify PYTHONPATH includes /app
          if ! grep -q 'value: "/app:' k8s/processor-deployment.yaml; then
            echo "❌ PYTHONPATH does not include /app!"
            exit 1
          fi

          # Verify image is placeholder (not :latest)
          if grep -q 'image:.*:latest' k8s/processor-deployment.yaml; then
            echo "❌ Deployment uses image:latest!"
            exit 1
          fi

          echo "✅ Deployment YAML validation passed"

  mypy-strict:
    name: Mypy (strict)
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    # Run on all PR checks (no longer need push condition since we removed push trigger)

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Run mypy (fail on errors) in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && python -m mypy src/ --ignore-missing-imports"

  security:
    name: Security Scan (weekly/manual only)
    runs-on: ubuntu-latest
    needs: [lint]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event.pull_request.draft == false || github.event_name != 'pull_request')

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Run bandit security scan in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && python -m bandit -r src/ -ll -f txt || true" && \
          echo "Bandit found issues but not failing build (review recommended)"

      - name: Check dependency vulnerabilities with safety
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && python -m safety check --json || true" && \
          echo "Safety check completed (review recommended)"
        continue-on-error: true

  unit:
    name: Unit Tests (fast)
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Create data directory for tests
        run: mkdir -p data

      - name: Run migrations in container
        env:
          DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DATABASE_URL="$DATABASE_URL" \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && alembic upgrade head"

      - name: Run unit tests in container
        env:
          DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
          TELEMETRY_DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TELEMETRY_DATABASE_URL="$TELEMETRY_DATABASE_URL" \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "
              git config --global --add safe.directory /workspace &&
              python3 scripts/validate_workflow_templates.py &&
              pytest -q --override-ini='addopts=' -p no:pytest-cov tests/unit/test_argo_workflow_template.py tests/unit/test_verification_no_head.py
            "

  argo-quick:
    name: Quick Workflow Template Checks
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    # Run on PRs to main (removed push condition since we no longer trigger on push)

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Create data directory for tests
        run: mkdir -p data

      - name: Run migrations in container
        env:
          DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DATABASE_URL="$DATABASE_URL" \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && alembic upgrade head"

      - name: Quick validator and targeted tests in container
        env:
          DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
          TELEMETRY_DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
          PYTEST_ADDOPTS: ""
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TELEMETRY_DATABASE_URL="$TELEMETRY_DATABASE_URL" \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            -e PYTEST_ADDOPTS="$PYTEST_ADDOPTS" \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "
              git config --global --add safe.directory /workspace &&
              python3 scripts/validate_workflow_templates.py &&
              pytest -q -c /dev/null -p no:pytest_cov -p no:pytest_postgresql tests/unit/test_argo_workflow_template.py tests/unit/test_verification_no_head.py
            "

  origin-proxy-only:
    name: Proxy stack tests (smoke)
    runs-on: ubuntu-latest
    needs: [changes, lint]  # Run early in parallel with unit tests
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    # Run on PRs to main (removed push condition since we no longer trigger on push)

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Create data directory for tests
        run: mkdir -p data

      - name: Run migrations in container
        env:
          DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DATABASE_URL="$DATABASE_URL" \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && alembic upgrade head"

      - name: Run proxy stack smoke tests in container
        env:
          DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
          TELEMETRY_DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TELEMETRY_DATABASE_URL="$TELEMETRY_DATABASE_URL" \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "set -euo pipefail; git config --global --add safe.directory /workspace && pytest -q --maxfail=1 -o addopts= tests/backend/test_lifecycle.py tests/test_deployment_requirements.py"

  selenium-headful:
    name: Selenium Headful Regression
    runs-on: ubuntu-latest
    needs: [changes, unit]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull crawler image
        run: docker pull ghcr.io/localnewsimpact/mizzou-crawler:latest

      - name: Run Selenium regression tests (headful-first)
        env:
          PYTHONWARNINGS: ignore
        run: |
          docker run --rm \
            --user root \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/localnewsimpact/mizzou-crawler:latest \
            /bin/bash -c "
              set -euo pipefail
              if ! command -v Xvfb >/dev/null; then
                export DEBIAN_FRONTEND=noninteractive
                mkdir -p /var/lib/apt/lists/partial && chmod -R 755 /var/lib/apt/lists
                apt-get update >/dev/null && apt-get install -y xvfb >/dev/null
              fi
              cat <<'WRAPPER' >/usr/local/bin/run-with-xvfb.sh
              #!/bin/bash
              set -euo pipefail
              DISPLAY_ID=":99"
              XVFB_ARGS="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset"
              Xvfb "$DISPLAY_ID" $XVFB_ARGS &
              XVFB_PID=$!
              trap "kill $XVFB_PID" EXIT
              DISPLAY=$DISPLAY_ID "$@"
              WRAPPER
              chmod +x /usr/local/bin/run-with-xvfb.sh
              chown -R appuser:appuser /workspace
              su appuser -c 'export SELENIUM_EXECUTION_MODE=headful && /usr/local/bin/run-with-xvfb.sh pytest -m enable_selenium tests/test_selenium_only_feature.py -vv'
            "

  postgres-integration:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [changes, unit, selenium-headful]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    # Run on PRs to main (removed push condition since we no longer trigger on push)

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizzou_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Create data directory for tests
        run: mkdir -p data

      - name: Run Alembic migrations on test database in container
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mizzou_test"
          DATABASE_ENGINE: "postgresql"
          DATABASE_HOST: "localhost"
          DATABASE_PORT: "5432"
          DATABASE_NAME: "mizzou_test"
          DATABASE_USER: "postgres"
          DATABASE_PASSWORD: "postgres"
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DATABASE_ENGINE="$DATABASE_ENGINE" \
            -e DATABASE_HOST="$DATABASE_HOST" \
            -e DATABASE_PORT="$DATABASE_PORT" \
            -e DATABASE_NAME="$DATABASE_NAME" \
            -e DATABASE_USER="$DATABASE_USER" \
            -e DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && alembic upgrade head"

      - name: Run all integration tests with PostgreSQL in container
        env:
          PYTEST_KEEP_DB_ENV: "true"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mizzou_test"
          TELEMETRY_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mizzou_test"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mizzou_test"
          DATABASE_ENGINE: "postgresql"
          DATABASE_HOST: "localhost"
          DATABASE_PORT: "5432"
          DATABASE_NAME: "mizzou_test"
          DATABASE_USER: "postgres"
          DATABASE_PASSWORD: "postgres"
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e PYTEST_KEEP_DB_ENV="$PYTEST_KEEP_DB_ENV" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TELEMETRY_DATABASE_URL="$TELEMETRY_DATABASE_URL" \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            -e DATABASE_ENGINE="$DATABASE_ENGINE" \
            -e DATABASE_HOST="$DATABASE_HOST" \
            -e DATABASE_PORT="$DATABASE_PORT" \
            -e DATABASE_NAME="$DATABASE_NAME" \
            -e DATABASE_USER="$DATABASE_USER" \
            -e DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && pytest -v -m 'integration and not docker and not local_scripts and not proxy' --tb=short --no-cov"

  firestore-integration:
    name: Integration Tests (Firestore)
    runs-on: ubuntu-latest
    needs: [changes, unit, selenium-headful]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')

    services:
      firestore:
        image: mtlynch/firestore-emulator-docker
        env:
          FIRESTORE_PROJECT_ID: mizzou-news-crawler-test
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Wait for Firestore emulator
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Firestore emulator never became ready" >&2
          exit 1

      - name: Run Firestore proxy router integration tests
        env:
          FIRESTORE_EMULATOR_HOST: "localhost:8080"
          GOOGLE_CLOUD_PROJECT: "mizzou-news-crawler-test"
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e FIRESTORE_EMULATOR_HOST="$FIRESTORE_EMULATOR_HOST" \
            -e GOOGLE_CLOUD_PROJECT="$GOOGLE_CLOUD_PROJECT" \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && pytest -v -m 'integration and proxy' --tb=short --no-cov"

  integration:
    name: Integration & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, unit, selenium-headful]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    # Run on PRs to main (removed push condition since we no longer trigger on push)
    # Note: This job runs coverage on non-PostgreSQL tests
    # PostgreSQL-specific tests run in the postgres-integration job

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Create data directory for tests
        run: mkdir -p data

      - name: Run tests with coverage (excludes PostgreSQL-specific and local dev tests)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && pytest -m 'not postgres and not docker and not local_scripts' --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=78"

      - name: Generate coverage summary
        if: success()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && python tools/generate_coverage_summary.py coverage.xml coverage-summary.md"

  quick-checks-integration:
    name: Quick DB Integration (resync migration)
    runs-on: ubuntu-latest
    needs: [unit, selenium-headful]
    # Only run on manual dispatch to main branch (requires TEST_DATABASE_URL secret)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizzou_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: "${{ secrets.TEST_DATABASE_URL }}"

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker run --rm --network host postgres:15 pg_isready -h 172.17.0.1 -p 5432 && break || sleep 1
          done

      - name: Run resync migration test (capture logs) in container
        env:
          TEST_DATABASE_URL: "${{ env.TEST_DATABASE_URL }}"
          DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/mizzou_test"
          DATABASE_ENGINE: "postgresql"
          DATABASE_HOST: "172.17.0.1"
          DATABASE_PORT: "5432"
          DATABASE_NAME: "mizzou_test"
          DATABASE_USER: "postgres"
          DATABASE_PASSWORD: "postgres"
        run: |
          set -o pipefail
          mkdir -p ci-logs
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DATABASE_ENGINE="$DATABASE_ENGINE" \
            -e DATABASE_HOST="$DATABASE_HOST" \
            -e DATABASE_PORT="$DATABASE_PORT" \
            -e DATABASE_NAME="$DATABASE_NAME" \
            -e DATABASE_USER="$DATABASE_USER" \
            -e DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            ghcr.io/localnewsimpact/mizzou-ci-base:latest \
            /bin/bash -c "git config --global --add safe.directory /workspace && pytest -vv tests/alembic/test_resync_sequence_postgres.py -c /dev/null" 2>&1 | tee ci-logs/resync-test.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resync-test-logs
          path: ci-logs/
          if-no-files-found: warn

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py311
          path: |
            coverage.xml
            coverage-summary.md
            htmlcov/
          if-no-files-found: warn


  stress:
    name: Stress Concurrency Tests (scheduled/manual only)
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event.pull_request.draft == false || github.event_name != 'pull_request')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - name: Clean Python bytecode cache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true


      - name: Log in to GHCR
        # Images are mirrored AR->GHCR (mirror-images.yml); pulls from GHCR to
        # GitHub-hosted runners are free and fast, vs ~$0.35-0.50 of Artifact
        # Registry egress per multi-GB pull. GITHUB_TOKEN can read packages
        # pushed by this repo's workflows.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image
        run: docker pull ghcr.io/localnewsimpact/mizzou-ci-base:latest

      - name: Run migrations in container
        env:
          DATABASE_URL: "postgresql://postgres:postgres@172.17.0.1:5432/test_db"
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace \
