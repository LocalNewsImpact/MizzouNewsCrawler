name: CI

# The crawler's CI, on the suite's shared pattern.
#
# The four stages -- lint, typecheck, test, test-integration -- are
# lnic-contracts' python-checks.yml, which runs `make <stage>` and nothing
# else. What each stage does is this repository's Makefile, the same
# targets a developer runs; CI's one difference is that the targets run
# inside the CI image (GITHUB_ACTIONS is set, so the Makefile's IN_IMAGE
# is). The conforms job checks that the Makefile keeps its side of that.
#
# The suites that are the crawler's alone stay here as jobs, each a make
# target too: the headful Selenium regression in the crawler image, the
# proxy-router tests against a Firestore emulator, and the weekly
# security scan and versioning stress run.
#
# Jobs are gated per job, never by a trigger-level `paths` filter: a
# skipped job satisfies a required status check, a never-triggered
# workflow leaves it pending forever.

on:
  # No push to main: branch protection requires a PR and passing CI, so
  # a merge would only re-run what already passed.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  schedule:
    - cron: '0 3 * * 0'  # weekly: security + stress
  workflow_dispatch: {}

# The shared workflow declares no permissions of its own; it runs with
# these. packages: read because every stage runs inside a private GHCR
# image that `make ci-image` pulls.
permissions:
  contents: read
  packages: read

jobs:
  # What does this PR change? Three answers, all from one diff:
  #   code    anything scripts/ci/docs-only.sh does not call documentation
  #           (the pre-push hook asks the same script, so the two agree)
  #   images  which container images the diff affects, for image-build-check
  # plus the one actor-based exception below.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Non-PR event (or missing SHAs) — running full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "images=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mb=$(git merge-base "$base" "$head" 2>/dev/null || echo "")
          if [ -z "$mb" ]; then
            echo "No merge-base found — running full suite to be safe."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "images=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$mb" "$head")
          echo "Changed files:"
          echo "$changed"

          # The image-tag bookkeeping PR is the one exception, and it is
          # recognised by WHO opened it, not by which files it touches: the
          # update-versions-env job records the tags already built and
          # deployed, so the suite would spend a full cycle validating
          # three strings that describe images CI has no say over. A
          # human editing the same files by hand still gets the suite.
          if [ "${{ github.event.pull_request.user.login }}" = "github-actions[bot]" ] \
             && [ "${{ startsWith(github.head_ref, 'chore/image-tags') }}" = "true" ]; then
            unexpected=$(echo "$changed" | grep -vE '^k8s/(versions\.env|argo/base-pipeline-workflow\.yaml)$' || true)
            if [ -z "$unexpected" ]; then
              echo "→ image-tag bookkeeping from the deploy job; skipping the suite."
              echo "code=false" >> "$GITHUB_OUTPUT"
              echo "images=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "→ bookkeeping branch touched more than the tag files; running full suite."
          fi

          if scripts/ci/docs-only.sh "$mb" "$head"; then
            echo "→ documentation only; skipping the suite."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "→ code changes present; running full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

          # Which container images does this PR's diff affect? Dockerfiles are
          # never built by the regular PR jobs (they run in PREBUILT images),
          # so image changes get a dedicated build+smoke via image-build-check.
          images=""
          add() { case ",$images," in *",$1,"*) ;; *) images="${images:+$images,}$1";; esac; }
          while IFS= read -r f; do
            case "$f" in
              Dockerfile.base|requirements-base.txt|requirements.txt) add base ;;
              Dockerfile.ml-base|requirements-ml.txt) add ml-base ;;
              Dockerfile.ci-base|requirements-dev.txt) add ci-base ;;
              Dockerfile.processor|requirements-processor.txt) add processor ;;
              Dockerfile.crawler|requirements-crawler.txt) add crawler ;;
              Dockerfile.api|requirements-api.txt|backend/*) add api ;;
              Dockerfile.migrator|requirements-migrator.txt) add migrator ;;
              alembic/*) add migrator ;;
            esac
          done <<< "$changed"
          echo "→ images affected: ${images:-none}"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # The four stages. python-checks.yml runs `make ci-image` before each
  # (the `install` input, with GITHUB_TOKEN in its environment), then
  # `make lint`, `make typecheck`, `make test`, `make test-integration`.
  # The test and integration stages get a Postgres 16 service -- what
  # production runs -- announced as PGHOST and friends, which the
  # Makefile reads for the integration database.
  checks:
    needs: [changes]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    uses: LocalNewsImpact/lnic-contracts/.github/workflows/python-checks.yml@ci-v1
    with:
      install: make ci-image
      typecheck: true
      integration: true
      postgres-db: mizzou_test

  conforms:
    uses: LocalNewsImpact/lnic-contracts/.github/workflows/conforms.yml@ci-v1
    with:
      # The same two flags the checks job declares. conforms uses them to
      # decide which make targets to require, so a stage turned on above
      # and not here would run a target nothing checks for.
      typecheck: true
      integration: true

  # PR CI runs tests INSIDE prebuilt images, so a PR that edits a Dockerfile
  # or requirements file is never actually built here — the change would first
  # execute in the post-merge production build. This job closes that gap:
  # build the affected image(s) from the PR source in Cloud Build with a
  # throwaway tag (nothing pushed) and smoke-test inside the fresh build.
  image-build-check:
    name: Image Build Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.images != ''
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build + smoke affected images from PR source
        run: |
          echo "Images affected by this PR: ${{ needs.changes.outputs.images }}"
          set +e
          gcloud builds submit \
            --config gcp/cloudbuild/cloudbuild-pr-image-check.yaml \
            --substitutions "^~^_IMAGES=${{ needs.changes.outputs.images }}" \
            --project mizzou-news-crawler \
            --gcs-source-staging-dir gs://mizzou-news-crawler-pr-staging/source \
            . 2>&1 | tee submit.log
          status=${PIPESTATUS[0]}
          set -e
          # The build logs to Cloud Logging only, so gcloud can't stream them
          # here — without this fetch a failure shows nothing but "status 1".
          build_id=$(grep -oE 'builds/[a-f0-9-]{36}' submit.log | head -1 | cut -d/ -f2)
          if [ -n "$build_id" ]; then
            gcloud builds log "$build_id" --project mizzou-news-crawler 2>/dev/null \
              | sed 's/^Step #[0-9]* - "build-and-smoke": //' > build.log
            echo ""
            echo "════════ Cloud Build log (build $build_id) ════════"
            cat build.log

            # Per-PR visibility: markdown summary on the job page with each
            # image's build/smoke/contract outcome, plus ::error:: annotations
            # so contract failures surface directly on the PR.
            {
              echo "## Image Build Check — build \`$build_id\`"
              echo ""
              if [ "$status" -eq 0 ]; then
                echo "**✅ SUCCESS** — all affected images built, smoked, and passed dependency contracts."
              else
                echo "**❌ FAILURE** — see annotations and log below."
              fi
              echo ""
              echo "| Image | Stage reached | Contracts verdict |"
              echo "|---|---|---|"
              awk '
                /^🔨 Building /       {img=$3; built[img]="built"; stage[img]="build"}
                /^🧪 Smoke: /         {stage[$3]="smoke"}
                /^📜 Dependency contracts: / {cur=$4; stage[cur]="contracts"}
                /(passed|failed|no tests ran)/ && cur {verdict[cur]=$0; cur=""}
                END {
                  for (i in built)
                    printf("| %s | %s | %s |\n", i, stage[i], (i in verdict ? verdict[i] : "—"))
                }' build.log
              echo ""
              echo "Full log: [Cloud Build console](https://console.cloud.google.com/cloud-build/builds/$build_id?project=mizzou-news-crawler)"
            } >> "$GITHUB_STEP_SUMMARY"

            grep -E "^FAILED |ERROR:" build.log | head -10 | while IFS= read -r line; do
              echo "::error title=Image Build Check::$line"
            done
          fi
          exit "$status"

  # The one suite that needs the Chrome the crawler ships, so it runs in
  # the crawler image rather than the CI image. After the stages: a PR
  # that fails lint does not pull a second multi-GB image.
  selenium-headful:
    name: Selenium Headful Regression
    runs-on: ubuntu-latest
    needs: [changes, checks]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v7
      - run: make crawler-image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make test-selenium

  firestore-integration:
    name: Integration Tests (Firestore)
    runs-on: ubuntu-latest
    needs: [changes, checks]
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    services:
      firestore:
        image: mtlynch/firestore-emulator-docker
        env:
          FIRESTORE_PROJECT_ID: mizzou-news-crawler-test
        ports:
          - 8080:8080
    # With the emulator announced, the Makefile runs the suite against it
    # rather than starting one of its own; the script waits for it.
    env:
      FIRESTORE_EMULATOR_HOST: localhost:8080
      GOOGLE_CLOUD_PROJECT: mizzou-news-crawler-test
    steps:
      - uses: actions/checkout@v7
      - run: make ci-image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make test-firestore

  security:
    name: Security Scan (weekly/manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - run: make ci-image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Advisory: bandit and safety report, the target does not fail.
      - run: make security

  stress:
    name: Stress Concurrency Tests (scheduled/manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stress
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    # Announced the way python-checks.yml announces its service, so the
    # Makefile's one database rule serves both.
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: stress
    steps:
      - uses: actions/checkout@v7
      - run: make ci-image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make stress
