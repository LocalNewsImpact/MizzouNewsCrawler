name: Build and Deploy Services

# Automatically build and deploy services when code changes are merged into main
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated: processor,api,crawler,base,ml-base, or "all")'
        required: false
        default: 'auto'
        type: string

# Dependent images build FROM the base image, so only ONE run of this workflow
# may be in flight at a time. Without this, a second run's crawler/api build
# pulls `base:latest` while the first run is still rebuilding it, silently
# producing an image on the previous base — the build still reports SUCCESS.
#
# That is not hypothetical: on 2026-07-20 two merges a minute apart raced, and
# the crawler image shipped without a dependency that had just been added to
# requirements-base.txt. `cancel-in-progress: false` matters — a queued run
# must wait, never replace, or we lose the build for that commit.
concurrency:
  group: build-and-deploy-services
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      processor: ${{ steps.detect.outputs.processor }}
      api: ${{ steps.detect.outputs.api }}
      crawler: ${{ steps.detect.outputs.crawler }}
      base: ${{ steps.detect.outputs.base }}
      ml_base: ${{ steps.detect.outputs.ml_base }}
      any_changed: ${{ steps.detect.outputs.any_changed }}
      services_to_build: ${{ steps.services.outputs.list }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history to compare with previous commits

      - name: Detect changed files
        id: detect
        run: |
          # Capture commit range for logging
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          echo "🔍 Change Detection Starting..."
          echo "Event: ${{ github.event_name }}"
          echo "Before: $BEFORE"
          echo "After: $AFTER"
          echo ""

          # Get list of changed files since last commit (for push) or since workflow dispatch (manual override)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual dispatch - use provided input or default to auto
            SERVICES_INPUT="${{ github.event.inputs.services }}"
            if [ "$SERVICES_INPUT" != "auto" ]; then
              echo "✅ Using manually specified services: $SERVICES_INPUT"
              # Parse comma-separated list
              for service in $(echo "$SERVICES_INPUT" | tr ',' ' '); do
                service=$(echo "$service" | xargs)  # trim whitespace
                echo "${service}=true" >> $GITHUB_OUTPUT
              done
              echo "any_changed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Get the commit range for change detection
          # Use multiple methods to ensure we catch all changes (works with squash merges, regular commits, etc.)
          CHANGED_FILES=""

          if [ "${{ github.event_name }}" == "push" ]; then
            # For push events, try multiple methods to detect changes
            if [ "$BEFORE" == "0000000000000000000000000000000000000000" ]; then
              # Initial push - check all files
              echo "📝 Initial push detected - checking all files"
              CHANGED_FILES=$(git ls-tree -r --name-only HEAD)
            else
              # Method 1: Standard diff-tree (works for regular commits)
              METHOD1=$(git diff-tree --no-commit-id --name-only -r $BEFORE $AFTER 2>/dev/null || true)

              # Method 2: Direct diff (works for squash merges and edge cases)
              METHOD2=$(git diff --name-only $BEFORE...$AFTER 2>/dev/null || true)

              # Combine results (remove duplicates)
              CHANGED_FILES=$(printf "%s\n%s" "$METHOD1" "$METHOD2" | grep -v '^$' | sort -u)

              # If both methods failed, compare with previous commit
              if [ -z "$CHANGED_FILES" ]; then
                echo "⚠️  Primary methods failed, using HEAD~1 fallback"
                CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
              fi
            fi
          else
            # Fallback: compare HEAD with HEAD~1
            echo "📝 Non-push event - comparing HEAD~1 with HEAD"
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi

          echo "📋 Changed files detected:"
          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | wc -l | xargs echo "Total:"
            echo "$CHANGED_FILES" | sed 's/^/  /'
          else
            echo "  (none detected)"
          fi
          echo ""

          # Analyze changes into shell flags. Emitted once at the end, after the
          # dependency cascade below, so each output key is written a single time.
          BASE=false
          ML_BASE=false
          PROCESSOR=false
          API=false
          CRAWLER=false

          # Base image: only for OS/dependency changes
          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.base|Dockerfile\.ci-base|requirements-base\.txt|requirements-dev\.txt'; then
            BASE=true
            echo "✅ Base image changed (Dockerfile.base / requirements-base.txt)"
          fi

          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.ml-base|requirements-ml\.txt'; then
            ML_BASE=true
            echo "✅ ML base image changed (Dockerfile.ml-base / requirements-ml.txt)"
          fi

          # Processor: processor-specific changes, ML code, or migrations
          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.processor|requirements-processor\.txt|src/(models|pipeline|utils|services|ml)/|pyproject\.toml|orchestration/|alembic/versions/'; then
            PROCESSOR=true
            echo "✅ Processor changed (processor code or migrations)"
          fi

          # API: API-specific changes, shared models, or migrations
          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.api|requirements-api\.txt|src/(models|services)/|backend/|pyproject\.toml|alembic/versions/'; then
            API=true
            echo "✅ API changed (API code or shared models)"
          fi

          # Crawler: crawler-specific changes
          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.crawler|requirements-crawler\.txt|src/(crawler|models|services|utils)/|pyproject\.toml'; then
            CRAWLER=true
            echo "✅ Crawler changed (crawler code)"
          fi

          # Cascade rebuilds down the image dependency graph so base/dependency/
          # security updates actually reach the running services. Without this, a
          # change to only requirements-base.txt rebuilds base:latest but leaves
          # processor/api/crawler on the old base until their own code changes.
          #   base    -> ml-base, processor, api, crawler  (all are FROM base,
          #              directly or via ml-base)
          #   ml-base -> processor                         (processor is FROM ml-base)
          if [ "$BASE" = "true" ]; then
            ML_BASE=true
            PROCESSOR=true
            API=true
            CRAWLER=true
            echo "↪️  Base changed — cascading rebuild to ml-base, processor, api, crawler"
          fi
          if [ "$ML_BASE" = "true" ]; then
            PROCESSOR=true
            echo "↪️  ML base changed — cascading rebuild to processor"
          fi

          # Emit final flags (once each)
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "ml_base=$ML_BASE" >> $GITHUB_OUTPUT
          echo "processor=$PROCESSOR" >> $GITHUB_OUTPUT
          echo "api=$API" >> $GITHUB_OUTPUT
          echo "crawler=$CRAWLER" >> $GITHUB_OUTPUT

          # Check if anything changed
          if [ -n "$CHANGED_FILES" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine services to build
        id: services
        run: |
          SERVICES=""

          [ "${{ steps.detect.outputs.base }}" == "true" ] && SERVICES="${SERVICES}base "
          [ "${{ steps.detect.outputs.ml_base }}" == "true" ] && SERVICES="${SERVICES}ml-base "
          [ "${{ steps.detect.outputs.processor }}" == "true" ] && SERVICES="${SERVICES}processor "
          [ "${{ steps.detect.outputs.api }}" == "true" ] && SERVICES="${SERVICES}api "
          [ "${{ steps.detect.outputs.crawler }}" == "true" ] && SERVICES="${SERVICES}crawler "

          if [ -z "$SERVICES" ]; then
            echo "list=none" >> $GITHUB_OUTPUT
          else
            # Remove trailing space and convert to comma-separated list
            SERVICES=$(echo "$SERVICES" | xargs | sed 's/ /,/g')
            echo "list=$SERVICES" >> $GITHUB_OUTPUT
          fi

      - name: Log detected changes
        run: |
          echo "=== Service Build Detection ==="
          echo "Event: ${{ github.event_name }}"
          echo "Base image rebuild: ${{ steps.detect.outputs.base }}"
          echo "ML base image rebuild: ${{ steps.detect.outputs.ml_base }}"
          echo "Processor rebuild: ${{ steps.detect.outputs.processor }}"
          echo "API rebuild: ${{ steps.detect.outputs.api }}"
          echo "Crawler rebuild: ${{ steps.detect.outputs.crawler }}"
          echo "Services to build: ${{ steps.services.outputs.list }}"
          echo "================================"

  # Every build below is triggered by SHA, never by branch. `--branch` builds
  # whatever main points at WHEN THE TRIGGER FIRES, which need not be the commit
  # this run validated. On 2026-07-26 #417 merged at 13:49:36 and #418 at
  # 13:50:03; #417's triggers fired at 13:50:18 and 13:50:44 and so built and
  # tagged 797faa0 -- #418's tree -- while reporting against c6082b1f. The
  # concurrency group above serialises Actions runs but cannot prevent this,
  # because the SHA was never pinned.
  build-base:
    name: Build Base Image
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}

    steps:
      - name: Skip base build (not requested)
        if: needs.detect-changes.outputs.base != 'true'
        run: 'echo "Info: Base image not requested; skipping Cloud Build trigger."'

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.base == 'true'

      - name: Authenticate to Google Cloud
        if: needs.detect-changes.outputs.base == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: needs.detect-changes.outputs.base == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger Cloud Build
        id: trigger
        if: needs.detect-changes.outputs.base == 'true'
        run: |
          set +e
          BUILD_ID=$(gcloud builds triggers run build-base-manual \
            --sha="${{ github.sha }}" \
            --format="value(metadata.build.id)" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger base image build"
            echo "$BUILD_ID"
            exit 1
          fi
          echo "✅ Base image build triggered (build ID: $BUILD_ID)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for base build to complete
        if: needs.detect-changes.outputs.base == 'true'
        run: |
          # Dependents (ml-base/api/crawler) build FROM base:latest, so the base
          # image must finish pushing before they build — otherwise they'd pull
          # the previous base. This job gates the downstream build jobs via
          # `needs`, so blocking here enforces correct ordering. Only base/
          # ml-base wait; processor/api/crawler still trigger back-to-back.
          BID="${{ steps.trigger.outputs.build_id }}"
          echo "⏳ Waiting for base Cloud Build $BID to complete..."
          for _ in $(seq 1 120); do
            STATUS=$(gcloud builds describe "$BID" --format="value(status)" 2>/dev/null || echo "")
            case "$STATUS" in
              SUCCESS) echo "✅ base build succeeded"; exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "❌ base build ended: $STATUS"; exit 1 ;;
              *) echo "  base build status: ${STATUS:-pending} (waiting)"; sleep 30 ;;
            esac
          done
          echo "❌ Timed out waiting for base build $BID"; exit 1

  build-ml-base:
    name: Build ML Base Image
    needs: [detect-changes, build-base]
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}

    steps:
      - name: Skip ml-base build (not requested)
        if: needs.detect-changes.outputs.ml_base != 'true'
        run: 'echo "Info: ML base image not requested; skipping Cloud Build trigger."'

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.ml_base == 'true'

      - name: Authenticate to Google Cloud
        if: needs.detect-changes.outputs.ml_base == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: needs.detect-changes.outputs.ml_base == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger Cloud Build
        id: trigger
        if: needs.detect-changes.outputs.ml_base == 'true'
        run: |
          set +e
          BUILD_ID=$(gcloud builds triggers run build-ml-base-manual \
            --sha="${{ github.sha }}" \
            --format="value(metadata.build.id)" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger ml-base image build"
            echo "$BUILD_ID"
            exit 1
          fi
          echo "✅ ML base image build triggered (build ID: $BUILD_ID)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for ml-base build to complete
        if: needs.detect-changes.outputs.ml_base == 'true'
        run: |
          # Processor builds FROM ml-base:latest, so ml-base must finish pushing
          # before the processor build starts (this job gates build-processor via
          # `needs`).
          BID="${{ steps.trigger.outputs.build_id }}"
          echo "⏳ Waiting for ml-base Cloud Build $BID to complete..."
          for _ in $(seq 1 120); do
            STATUS=$(gcloud builds describe "$BID" --format="value(status)" 2>/dev/null || echo "")
            case "$STATUS" in
              SUCCESS) echo "✅ ml-base build succeeded"; exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "❌ ml-base build ended: $STATUS"; exit 1 ;;
              *) echo "  ml-base build status: ${STATUS:-pending} (waiting)"; sleep 30 ;;
            esac
          done
          echo "❌ Timed out waiting for ml-base build $BID"; exit 1

  build-processor:
    name: Build Processor
    needs: [detect-changes, build-ml-base]
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}

    steps:
      - name: Skip processor build (not requested)
        if: needs.detect-changes.outputs.processor != 'true'
        run: 'echo "Info: Processor image not requested; skipping Cloud Build trigger."'

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.processor == 'true'

      - name: Authenticate to Google Cloud
        if: needs.detect-changes.outputs.processor == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: needs.detect-changes.outputs.processor == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger Cloud Build
        id: trigger
        if: needs.detect-changes.outputs.processor == 'true'
        run: |
          set +e
          BUILD_ID=$(gcloud builds triggers run build-processor-manual \
            --sha="${{ github.sha }}" \
            --format="value(metadata.build.id)" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger processor build"
            echo "$BUILD_ID"
            exit 1
          fi
          echo "✅ Processor build triggered (build ID: $BUILD_ID)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

  build-api:
    name: Build API
    needs: [detect-changes, build-processor]
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}

    steps:
      - name: Skip API build (not requested)
        if: needs.detect-changes.outputs.api != 'true'
        run: 'echo "Info: API image not requested; skipping Cloud Build trigger."'

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.api == 'true'

      - name: Authenticate to Google Cloud
        if: needs.detect-changes.outputs.api == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: needs.detect-changes.outputs.api == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger Cloud Build
        id: trigger
        if: needs.detect-changes.outputs.api == 'true'
        run: |
          set +e
          BUILD_ID=$(gcloud builds triggers run build-api-manual \
            --sha="${{ github.sha }}" \
            --format="value(metadata.build.id)" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger API build"
            echo "$BUILD_ID"
            exit 1
          fi
          echo "✅ API build triggered (build ID: $BUILD_ID)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

  build-crawler:
    name: Build Crawler
    needs: [detect-changes, build-api]
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}

    steps:
      - name: Skip crawler build (not requested)
        if: needs.detect-changes.outputs.crawler != 'true'
        run: 'echo "Info: Crawler image not requested; skipping Cloud Build trigger."'

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.crawler == 'true'

      - name: Authenticate to Google Cloud
        if: needs.detect-changes.outputs.crawler == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: needs.detect-changes.outputs.crawler == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger Cloud Build
        id: trigger
        if: needs.detect-changes.outputs.crawler == 'true'
        run: |
          set +e
          BUILD_ID=$(gcloud builds triggers run build-crawler-manual \
            --sha="${{ github.sha }}" \
            --format="value(metadata.build.id)" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger crawler build"
            echo "$BUILD_ID"
            exit 1
          fi
          echo "✅ Crawler build triggered (build ID: $BUILD_ID)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

  wait-for-builds:
    name: Wait for Cloud Builds
    needs: [detect-changes, build-base, build-ml-base, build-processor, build-api, build-crawler]
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Wait for builds to complete
        env:
          BASE_BUILD_ID: ${{ needs.build-base.outputs.build_id }}
          ML_BASE_BUILD_ID: ${{ needs.build-ml-base.outputs.build_id }}
          PROCESSOR_BUILD_ID: ${{ needs.build-processor.outputs.build_id }}
          API_BUILD_ID: ${{ needs.build-api.outputs.build_id }}
          CRAWLER_BUILD_ID: ${{ needs.build-crawler.outputs.build_id }}
        run: |
          echo "⏳ Waiting for Cloud Build jobs to complete..."
          echo ""

          # Store build IDs from submitted jobs
          SERVICES="${{ needs.detect-changes.outputs.services_to_build }}"

          if [ "$SERVICES" == "none" ]; then
            echo "ℹ️  No service rebuilds - skipping build wait"
            exit 0
          fi

          declare -a BUILD_IDS=()
          declare -a BUILD_NAMES=()

          add_build() {
            local id="$1"
            local name="$2"
            if [ -n "$id" ]; then
              BUILD_IDS+=("$id")
              BUILD_NAMES+=("$name")
            fi
          }

          add_build "$BASE_BUILD_ID" "base"
          add_build "$ML_BASE_BUILD_ID" "ml-base"
          add_build "$PROCESSOR_BUILD_ID" "processor"
          add_build "$API_BUILD_ID" "api"
          add_build "$CRAWLER_BUILD_ID" "crawler"

          TOTAL_BUILDS=${#BUILD_IDS[@]}
          if [ $TOTAL_BUILDS -eq 0 ]; then
            echo "ℹ️  No Cloud Build jobs were triggered in this workflow run."
            exit 0
          fi

          echo "Tracking $TOTAL_BUILDS build(s):"
          for idx in "${!BUILD_IDS[@]}"; do
            echo "  - ${BUILD_NAMES[$idx]} (${BUILD_IDS[$idx]})"
          done
          echo ""

          # Poll builds until completion
          MAX_WAIT=3600  # 60 minutes timeout
          ELAPSED=0
          POLL_INTERVAL=30

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STILL_RUNNING=0

            for idx in "${!BUILD_IDS[@]}"; do
              BUILD_ID=${BUILD_IDS[$idx]}
              SERVICE=${BUILD_NAMES[$idx]}
              STATUS=$(gcloud builds describe "$BUILD_ID" \
                --format='value(status)')

              case $STATUS in
                QUEUED|WORKING)
                  echo "⏳ [$SERVICE] Build $BUILD_ID still running (status: $STATUS)"
                  STILL_RUNNING=$((STILL_RUNNING + 1))
                  ;;
                SUCCESS)
                  echo "✅ [$SERVICE] Build $BUILD_ID completed successfully"
                  ;;
                FAILURE)
                  echo "❌ [$SERVICE] Build $BUILD_ID failed"
                  exit 1
                  ;;
                TIMEOUT)
                  echo "⏱️  [$SERVICE] Build $BUILD_ID timed out"
                  exit 1
                  ;;
                CANCELLED)
                  echo "⚠️  [$SERVICE] Build $BUILD_ID was cancelled"
                  exit 1
                  ;;
                *)
                  if [ -z "$STATUS" ]; then
                    echo "⚠️  [$SERVICE] Build $BUILD_ID status unavailable (possibly expired)"
                  else
                    echo "⚠️  [$SERVICE] Build $BUILD_ID status: $STATUS"
                  fi
                  ;;
              esac
            done

            if [ $STILL_RUNNING -eq 0 ]; then
              echo ""
              echo "✅ All tracked builds completed!"
              exit 0
            fi

            echo "  Waiting $POLL_INTERVAL seconds before next check... ($ELAPSED/$MAX_WAIT seconds elapsed)"
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "❌ Timeout waiting for builds (exceeded ${MAX_WAIT}s)"
          exit 1

  build-summary:
    name: Build Summary
    needs: [detect-changes, wait-for-builds]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report build status
        run: |
          echo "=== Build and Deploy Summary ==="
          echo "Services targeted: ${{ needs.detect-changes.outputs.services_to_build }}"

          if [ "${{ needs.detect-changes.outputs.services_to_build }}" == "none" ]; then
            echo "ℹ️  No service rebuilds detected (documentation/config-only changes)"
          else
            BUILD_RESULT="${{ needs.wait-for-builds.result }}"
            if [ "$BUILD_RESULT" == "success" ] || [ "$BUILD_RESULT" == "skipped" ]; then
              echo "✅ All Cloud Build jobs completed successfully"
              echo "🚀 Services deployed automatically via Cloud Build triggers"
              echo "   - Kubernetes deployments updated with new image tags"
              echo "   - Argo WorkflowTemplate updated with new image tags"
            else
              echo "❌ Build wait job failed (result: $BUILD_RESULT)"
              exit 1
            fi
          fi

  update-versions-env:
    name: Update versions.env
    # The build-* jobs must be listed here, not just reached transitively via
    # wait-for-builds: the `needs` context contains ONLY direct dependencies,
    # so `needs.build-crawler.outputs.build_id` resolved to empty and this job
    # reported success while updating nothing. k8s/versions.env consequently
    # went un-updated from 2026-04-03 until this fix, leaving the committed
    # tags months behind what is actually deployed.
    needs:
      [
        detect-changes,
        wait-for-builds,
        build-base,
        build-ml-base,
        build-processor,
        build-api,
        build-crawler,
      ]
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        needs.build-base.outputs.build_id != '' ||
        needs.build-ml-base.outputs.build_id != '' ||
        needs.build-processor.outputs.build_id != '' ||
        needs.build-api.outputs.build_id != '' ||
        needs.build-crawler.outputs.build_id != ''
      ) &&
      (needs.wait-for-builds.result == 'success' || needs.wait-for-builds.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare main branch
        run: |
          git checkout main
          git pull --ff-only origin main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update versions file
        env:
          SHORT_SHA: ${{ github.sha }}
          PROCESSOR_BUILD_ID: ${{ needs.build-processor.outputs.build_id }}
          API_BUILD_ID: ${{ needs.build-api.outputs.build_id }}
          CRAWLER_BUILD_ID: ${{ needs.build-crawler.outputs.build_id }}
        run: |
          SHORT=${SHORT_SHA:0:7}
          ARGS=()
          if [ -n "$PROCESSOR_BUILD_ID" ]; then ARGS+=(--processor "$SHORT"); fi
          if [ -n "$CRAWLER_BUILD_ID" ]; then ARGS+=(--crawler "$SHORT"); fi
          if [ -n "$API_BUILD_ID" ]; then ARGS+=(--api "$SHORT"); fi
          if [ ${#ARGS[@]} -eq 0 ]; then
            # This job's `if:` already established that at least one build ran,
            # so reaching here means the build IDs did not resolve -- the exact
            # silent no-op that left versions.env stale for ~4 months. Fail
            # loudly rather than report success while doing nothing.
            echo "::error::Build IDs did not resolve despite this job being" \
                 "triggered by a build. Check that every build-* job is listed" \
                 "in this job's needs: -- the needs context only exposes direct" \
                 "dependencies, so transitive access via wait-for-builds is empty."
            exit 1
          fi
          ./scripts/update-versions-env.sh "${ARGS[@]}"
          if git diff --quiet k8s/versions.env k8s/argo/base-pipeline-workflow.yaml; then
            echo "versions.env and Argo workflow already up to date"
            exit 0
          fi
          git add k8s/versions.env k8s/argo/base-pipeline-workflow.yaml
          git commit -m "chore: update image tags (${SHORT}) [skip ci]"
          git push origin HEAD
