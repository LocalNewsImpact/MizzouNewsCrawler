name: Build and Deploy Services

# Automatically build and deploy services when code changes are merged into main
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated: processor,api,crawler,migrator,enrichment, or "all"; base or ml-base forces a base-image rebuild)'
        required: false
        default: 'auto'
        type: string

# Dependent images build FROM the base image, so only ONE run of this workflow
# may be in flight at a time. Without this, a second run's crawler/api build
# pulls `base:latest` while the first run is still rebuilding it, silently
# producing an image on the previous base — the build still reports SUCCESS.
#
# That is not hypothetical: on 2026-07-20 two merges a minute apart raced, and
# the crawler image shipped without a dependency that had just been added to
# requirements-base.txt. `cancel-in-progress: false` matters — a queued run
# must wait, never replace, or we lose the build for that commit.
concurrency:
  group: build-and-deploy-services
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      processor: ${{ steps.detect.outputs.processor }}
      api: ${{ steps.detect.outputs.api }}
      crawler: ${{ steps.detect.outputs.crawler }}
      migrator: ${{ steps.detect.outputs.migrator }}
      enrichment: ${{ steps.detect.outputs.enrichment }}
      base: ${{ steps.detect.outputs.base }}
      ml_base: ${{ steps.detect.outputs.ml_base }}
      any_changed: ${{ steps.detect.outputs.any_changed }}
      services_to_build: ${{ steps.services.outputs.list }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history to compare with previous commits

      - name: Detect changed files
        id: detect
        run: |
          # Capture commit range for logging
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          echo "🔍 Change Detection Starting..."
          echo "Event: ${{ github.event_name }}"
          echo "Before: $BEFORE"
          echo "After: $AFTER"
          echo ""

          # Get list of changed files since last commit (for push) or since workflow dispatch (manual override)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual dispatch - use provided input or default to auto
            SERVICES_INPUT="${{ github.event.inputs.services }}"
            if [ "$SERVICES_INPUT" != "auto" ]; then
              echo "✅ Using manually specified services: $SERVICES_INPUT"
              # Parse comma-separated list
              for service in $(echo "$SERVICES_INPUT" | tr ',' ' '); do
                service=$(echo "$service" | xargs)  # trim whitespace
                echo "${service}=true" >> $GITHUB_OUTPUT
              done
              echo "any_changed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Get the commit range for change detection
          # Use multiple methods to ensure we catch all changes (works with squash merges, regular commits, etc.)
          CHANGED_FILES=""

          if [ "${{ github.event_name }}" == "push" ]; then
            # For push events, try multiple methods to detect changes
            if [ "$BEFORE" == "0000000000000000000000000000000000000000" ]; then
              # Initial push - check all files
              echo "📝 Initial push detected - checking all files"
              CHANGED_FILES=$(git ls-tree -r --name-only HEAD)
            else
              # Method 1: Standard diff-tree (works for regular commits)
              METHOD1=$(git diff-tree --no-commit-id --name-only -r $BEFORE $AFTER 2>/dev/null || true)

              # Method 2: Direct diff (works for squash merges and edge cases)
              METHOD2=$(git diff --name-only $BEFORE...$AFTER 2>/dev/null || true)

              # Combine results (remove duplicates)
              CHANGED_FILES=$(printf "%s\n%s" "$METHOD1" "$METHOD2" | grep -v '^$' | sort -u)

              # If both methods failed, compare with previous commit
              if [ -z "$CHANGED_FILES" ]; then
                echo "⚠️  Primary methods failed, using HEAD~1 fallback"
                CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
              fi
            fi
          else
            # Fallback: compare HEAD with HEAD~1
            echo "📝 Non-push event - comparing HEAD~1 with HEAD"
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi

          echo "📋 Changed files detected:"
          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | wc -l | xargs echo "Total:"
            echo "$CHANGED_FILES" | sed 's/^/  /'
          else
            echo "  (none detected)"
          fi
          echo ""

          # Analyze changes into shell flags. Emitted once at the end, after the
          # dependency cascade below, so each output key is written a single time.
          BASE=false
          ML_BASE=false
          PROCESSOR=false
          API=false
          CRAWLER=false
          MIGRATOR=false
          ENRICHMENT=false

          # Base image: only for OS/dependency changes
          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.base|Dockerfile\.ci-base|requirements-base\.txt|requirements-dev\.txt'; then
            BASE=true
            echo "✅ Base image changed (Dockerfile.base / requirements-base.txt)"
          fi

          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.ml-base|requirements-ml\.txt'; then
            ML_BASE=true
            echo "✅ ML base image changed (Dockerfile.ml-base / requirements-ml.txt)"
          fi

          # Each pattern below is what that image's Dockerfile copies, and
          # tests/test_deploy_filters_match_the_dockerfiles.py holds it to
          # that. The images copy src/ whole, so the pattern is src/ whole.
          #
          # Three deploys were lost to listing subdirectories of src/
          # instead: #423 (2026-07-26) touched only src/cli/ and
          # src/reporting/ and built nothing; #453 (2026-08-12) touched only
          # src/crawler/, built the crawler, and left the processor -- which
          # the dataset-discovery jobs run -- on the previous commit's crawler
          # code while the deploy reported success. After both were added,
          # src/mcmetadata/ (the extraction parser), src/config.py,
          # src/telemetry/ and src/lookups/ still matched nothing.
          #
          # Processor: everything in its image, plus migrations.
          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.processor|requirements-processor\.txt|src/|orchestration/|scripts/|sitecustomize\.py|pyproject\.toml|alembic/versions/'; then
            PROCESSOR=true
            echo "✅ Processor changed (processor code or migrations)"
          fi

          # API: everything in its image. It carries alembic/ whole, not only
          # the versions.
          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.api|requirements-api\.txt|src/|backend/|web/|alembic/|alembic\.ini|pyproject\.toml'; then
            API=true
            echo "✅ API changed (API code or shared models)"
          fi

          # Crawler: everything in its image. lookups/ and fingerprints/ are
          # data the crawler reads at runtime; a changed site rule that is not
          # built is a site rule that is not applied.
          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.crawler|requirements-crawler\.txt|src/|lookups/|orchestration/|fingerprints/|sitecustomize\.py|scripts/xvfb-wrapper\.sh|pyproject\.toml'; then
            CRAWLER=true
            echo "✅ Crawler changed (crawler code)"
          fi

          # Migrator: the image run-migrations.yml runs against production.
          # A merged migration rebuilt the processor and api images (both
          # list alembic/versions/ above) but never the image that applies
          # it, so the migration job could only run at a SHA where the
          # Dockerfile or its requirements had changed. Between 2026-07-26
          # and 2026-08-23 the newest migrator image was a month old while
          # production's schema drifted ahead of its recorded revision.
          #
          # The migrator copies src/ whole but runs only what alembic/env.py
          # imports from it (src/config.py, src/models/), so those are what
          # rebuild it. Matching all of src/ would rebuild it -- and run the
          # migration job against production -- on every code push.
          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.migrator|requirements-migrator\.txt|alembic/|alembic\.ini|scripts/migrations/|src/models/|src/config\.py'; then
            MIGRATOR=true
            echo "✅ Migrator changed (migrations or migrator image)"
          fi

          # Enrichment: everything in its image; vendor/backfield/ is the
          # pinned backfield wheel set it installs.
          if echo "$CHANGED_FILES" | grep -qE 'Dockerfile\.enrichment|vendor/backfield/|src/|sitecustomize\.py|pyproject\.toml'; then
            ENRICHMENT=true
            echo "✅ Enrichment changed (enrichment code or vendored backfield)"
          fi

          # Cascade rebuilds down the image dependency graph so base/dependency/
          # security updates actually reach the running services. Without this, a
          # change to only requirements-base.txt rebuilds base:latest but leaves
          # processor/api/crawler on the old base until their own code changes.
          #   base    -> ml-base, processor, api, crawler  (all are FROM base,
          #              directly or via ml-base)
          #   ml-base -> processor                         (processor is FROM ml-base)
          if [ "$BASE" = "true" ]; then
            ML_BASE=true
            PROCESSOR=true
            API=true
            CRAWLER=true
            echo "↪️  Base changed — cascading rebuild to ml-base, processor, api, crawler"
          fi
          if [ "$ML_BASE" = "true" ]; then
            PROCESSOR=true
            echo "↪️  ML base changed — cascading rebuild to processor"
          fi

          # Emit final flags (once each)
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "ml_base=$ML_BASE" >> $GITHUB_OUTPUT
          echo "processor=$PROCESSOR" >> $GITHUB_OUTPUT
          echo "api=$API" >> $GITHUB_OUTPUT
          echo "crawler=$CRAWLER" >> $GITHUB_OUTPUT
          echo "migrator=$MIGRATOR" >> $GITHUB_OUTPUT
          echo "enrichment=$ENRICHMENT" >> $GITHUB_OUTPUT

          # Check if anything changed
          if [ -n "$CHANGED_FILES" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine services to build
        id: services
        run: |
          SERVICES=""

          [ "${{ steps.detect.outputs.base }}" == "true" ] && SERVICES="${SERVICES}base "
          [ "${{ steps.detect.outputs.ml_base }}" == "true" ] && SERVICES="${SERVICES}ml-base "
          [ "${{ steps.detect.outputs.processor }}" == "true" ] && SERVICES="${SERVICES}processor "
          [ "${{ steps.detect.outputs.api }}" == "true" ] && SERVICES="${SERVICES}api "
          [ "${{ steps.detect.outputs.crawler }}" == "true" ] && SERVICES="${SERVICES}crawler "
          [ "${{ steps.detect.outputs.migrator }}" == "true" ] && SERVICES="${SERVICES}migrator "
          [ "${{ steps.detect.outputs.enrichment }}" == "true" ] && SERVICES="${SERVICES}enrichment "

          if [ -z "$SERVICES" ]; then
            echo "list=none" >> $GITHUB_OUTPUT
          else
            # Remove trailing space and convert to comma-separated list
            SERVICES=$(echo "$SERVICES" | xargs | sed 's/ /,/g')
            echo "list=$SERVICES" >> $GITHUB_OUTPUT
          fi

      - name: Log detected changes
        run: |
          echo "=== Service Build Detection ==="
          echo "Event: ${{ github.event_name }}"
          echo "Base image rebuild: ${{ steps.detect.outputs.base }}"
          echo "ML base image rebuild: ${{ steps.detect.outputs.ml_base }}"
          echo "Processor rebuild: ${{ steps.detect.outputs.processor }}"
          echo "API rebuild: ${{ steps.detect.outputs.api }}"
          echo "Crawler rebuild: ${{ steps.detect.outputs.crawler }}"
          echo "Migrator rebuild: ${{ steps.detect.outputs.migrator }}"
          echo "Enrichment rebuild: ${{ steps.detect.outputs.enrichment }}"
          echo "Services to build: ${{ steps.services.outputs.list }}"
          echo "================================"

  # Every build below is triggered by SHA, never by branch. `--branch` builds
  # whatever main points at WHEN THE TRIGGER FIRES, which need not be the commit
  # this run validated. On 2026-07-26 #417 merged at 13:49:36 and #418 at
  # 13:50:03; #417's triggers fired at 13:50:18 and 13:50:44 and so built and
  # tagged 797faa0 -- #418's tree -- while reporting against c6082b1f. The
  # concurrency group above serialises Actions runs but cannot prevent this,
  # because the SHA was never pinned.
  # The base images, by content hash, ahead of every service build (the
  # services are FROM them). The called workflow waits for each Cloud Build
  # to finish, so `needs` on this job is the ordering the concurrency note
  # above describes: no service build starts while base:latest is being
  # replaced. It runs on every push: the registry check that decides
  # whether anything is built costs seconds, and it is what guarantees an
  # image exists for what the pins say -- whether or not the path filters
  # in detect-changes noticed. This replaces two jobs here that still ran
  # the triggers without the _TAG the configs came to require, which is
  # how run #228 failed on 2026-09-05.
  base-images:
    name: Base images
    uses: ./.github/workflows/base-images.yml
    secrets: inherit
    with:
      # `base` or `ml-base` in a manual dispatch: rebuild even when an image
      # exists for these contents (an upstream refresh the hash cannot see).
      force: ${{ github.event_name == 'workflow_dispatch' && (contains(github.event.inputs.services, 'base') || github.event.inputs.services == 'all') }}

  build-processor:
    name: Build Processor
    needs: [detect-changes, base-images]
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}

    steps:
      - name: Skip processor build (not requested)
        if: needs.detect-changes.outputs.processor != 'true'
        run: 'echo "Info: Processor image not requested; skipping Cloud Build trigger."'

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.processor == 'true'

      - name: Authenticate to Google Cloud
        if: needs.detect-changes.outputs.processor == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: needs.detect-changes.outputs.processor == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger Cloud Build
        id: trigger
        if: needs.detect-changes.outputs.processor == 'true'
        run: |
          set +e
          BUILD_ID=$(gcloud builds triggers run build-processor-manual \
            --sha="${{ github.sha }}" \
            --format="value(metadata.build.id)" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger processor build"
            echo "$BUILD_ID"
            exit 1
          fi
          echo "✅ Processor build triggered (build ID: $BUILD_ID)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

  build-api:
    name: Build API
    needs: [detect-changes, build-processor]
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}

    steps:
      - name: Skip API build (not requested)
        if: needs.detect-changes.outputs.api != 'true'
        run: 'echo "Info: API image not requested; skipping Cloud Build trigger."'

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.api == 'true'

      - name: Authenticate to Google Cloud
        if: needs.detect-changes.outputs.api == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: needs.detect-changes.outputs.api == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger Cloud Build
        id: trigger
        if: needs.detect-changes.outputs.api == 'true'
        run: |
          set +e
          BUILD_ID=$(gcloud builds triggers run build-api-manual \
            --sha="${{ github.sha }}" \
            --format="value(metadata.build.id)" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger API build"
            echo "$BUILD_ID"
            exit 1
          fi
          echo "✅ API build triggered (build ID: $BUILD_ID)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

  build-crawler:
    name: Build Crawler
    needs: [detect-changes, build-api]
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}

    steps:
      - name: Skip crawler build (not requested)
        if: needs.detect-changes.outputs.crawler != 'true'
        run: 'echo "Info: Crawler image not requested; skipping Cloud Build trigger."'

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.crawler == 'true'

      - name: Authenticate to Google Cloud
        if: needs.detect-changes.outputs.crawler == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: needs.detect-changes.outputs.crawler == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger Cloud Build
        id: trigger
        if: needs.detect-changes.outputs.crawler == 'true'
        run: |
          set +e
          BUILD_ID=$(gcloud builds triggers run build-crawler-manual \
            --sha="${{ github.sha }}" \
            --format="value(metadata.build.id)" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger crawler build"
            echo "$BUILD_ID"
            exit 1
          fi
          echo "✅ Crawler build triggered (build ID: $BUILD_ID)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

  build-migrator:
    name: Build Migrator
    # Not in the base -> ml-base -> processor -> api -> crawler chain: the
    # migrator is FROM python:3.11-slim directly, so it depends on none of
    # them and runs alongside.
    needs: [detect-changes]
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}

    steps:
      - name: Skip migrator build (not requested)
        if: needs.detect-changes.outputs.migrator != 'true'
        run: 'echo "Info: migrator image not requested; skipping Cloud Build trigger."'

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.migrator == 'true'

      - name: Authenticate to Google Cloud
        if: needs.detect-changes.outputs.migrator == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: needs.detect-changes.outputs.migrator == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger Cloud Build
        id: trigger
        if: needs.detect-changes.outputs.migrator == 'true'
        run: |
          set +e
          BUILD_ID=$(gcloud builds triggers run build-migrator-manual \
            --sha="${{ github.sha }}" \
            --format="value(metadata.build.id)" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger migrator build"
            echo "$BUILD_ID"
            exit 1
          fi
          echo "✅ Migrator build triggered (build ID: $BUILD_ID)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

  build-enrichment:
    name: Build Enrichment
    needs: [detect-changes, build-crawler]
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.trigger.outputs.build_id }}

    steps:
      - name: Skip enrichment build (not requested)
        if: needs.detect-changes.outputs.enrichment != 'true'
        run: 'echo "Info: Enrichment image not requested; skipping Cloud Build trigger."'

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.enrichment == 'true'

      - name: Authenticate to Google Cloud
        if: needs.detect-changes.outputs.enrichment == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: needs.detect-changes.outputs.enrichment == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger Cloud Build
        id: trigger
        if: needs.detect-changes.outputs.enrichment == 'true'
        run: |
          set +e
          BUILD_ID=$(gcloud builds triggers run build-enrichment-manual \
            --sha="${{ github.sha }}" \
            --format="value(metadata.build.id)" 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to trigger enrichment build"
            echo "$BUILD_ID"
            exit 1
          fi
          echo "✅ Enrichment build triggered (build ID: $BUILD_ID)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

  run-migrations:
    name: Run Migrations
    # Deliberately NOT behind wait-for-builds. The migrator builds in parallel
    # with base -> ml-base -> processor -> api -> crawler, and the cloudbuild
    # configs for those images deploy them as their last step. Waiting would
    # apply the schema change after the code that depends on it was already
    # serving traffic. This waits only for the migrator's own build.
    needs: [detect-changes, build-migrator]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.migrator == 'true' &&
      needs.build-migrator.outputs.build_id != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          # kubectl authenticates with nothing without this, and every command
          # fails on "Install gke-gcloud-auth-plugin ... exit code 1" -- a message
          # naming a missing plugin rather than a missing permission, raised after
          # the images have built. The deploy goes green and the schema does not
          # move. Two other workflows here already install it; these did not.
          install_components: 'gke-gcloud-auth-plugin'

      # Every other job here reaches Google Cloud on the default project the
      # auth step derives from the service-account key. This job asked for
      # `secrets.GCP_PROJECT_ID`, which is not a secret on this repository, so
      # it expanded to an empty string: `gcloud builds describe --project=`
      # failed on every poll, the `|| echo UNKNOWN` below swallowed it, and the
      # loop ran the full fifteen minutes against a build that had already
      # succeeded. The rendered image reference would have been wrong too.
      #
      # Resolve it once, from the credentials, and fail loudly if it is absent
      # rather than carrying an empty string into a URL.
      - name: Resolve the project
        run: |
          PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if [ -z "$PROJECT" ] || [ "$PROJECT" = "(unset)" ]; then
            echo "::error::gcloud has no default project; the service-account" \
                 "key should supply one."
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "project: $PROJECT"

      - name: Wait for the migrator image
        env:
          BUILD_ID: ${{ needs.build-migrator.outputs.build_id }}
        run: |
          echo "Waiting for migrator build $BUILD_ID in $PROJECT"
          ELAPSED=0
          ERRORS=0
          while [ $ELAPSED -lt 900 ]; do
            # Separate "the poll failed" from "the build is still running".
            # Conflating them is what turned a broken --project flag into a
            # fifteen-minute wait instead of an immediate error.
            if ! STATUS=$(gcloud builds describe "$BUILD_ID" \
                 --project="$PROJECT" --format="value(status)" 2>/tmp/poll.err); then
              ERRORS=$((ERRORS + 1))
              echo "poll failed ($ERRORS): $(tail -1 /tmp/poll.err)"
              if [ $ERRORS -ge 3 ]; then
                echo "::error::Could not read the build status three times running."
                exit 1
              fi
              STATUS=UNKNOWN
            else
              ERRORS=0
            fi
            case "$STATUS" in
              SUCCESS)
                echo "Migrator image built"
                exit 0
                ;;
              FAILURE|TIMEOUT|CANCELLED|EXPIRED|INTERNAL_ERROR)
                echo "Migrator build finished as $STATUS"
                echo "https://console.cloud.google.com/cloud-build/builds/$BUILD_ID"
                exit 1
                ;;
            esac
            sleep 20
            ELAPSED=$((ELAPSED + 20))
          done
          echo "Migrator build did not finish within 15 minutes"
          exit 1

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials mizzou-cluster \
            --zone=us-central1-a \
            --project="$PROJECT"

      - name: Render the migration job
        env:
          IMAGE_TAG: ${{ github.sha }}
          JOB_NAME: alembic-migration-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Mirrors the manifest in run-migrations.yml, which stays as the
          # manual path for staging and for replaying a specific SHA.
          sed \
            -e "s|__JOB_NAME__|${JOB_NAME}|g" \
            -e "s|__IMAGE__|us-central1-docker.pkg.dev/${PROJECT}/mizzou-crawler/migrator:${IMAGE_TAG}|g" \
            -e "s|__RUN_ID__|${{ github.run_id }}|g" \
            k8s/deploy-migration-job.tpl.yaml > /tmp/migration-job.yaml
          cat /tmp/migration-job.yaml

      - name: Apply and wait
        env:
          JOB_NAME: alembic-migration-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          kubectl apply -f /tmp/migration-job.yaml

          kubectl wait --for=condition=complete --timeout=600s \
            "job/${JOB_NAME}" -n production && RESULT=0 || RESULT=1

          echo "--- migration log ---"
          kubectl logs "job/${JOB_NAME}" -n production --tail=200 || true

          if [ $RESULT -ne 0 ]; then
            echo "::error::Migration job did not complete. The images for this commit are built and deploying; the schema they expect is not in place."
            kubectl describe "job/${JOB_NAME}" -n production || true
            exit 1
          fi

          echo "Migrations applied at ${{ github.sha }}"

  wait-for-builds:
    name: Wait for Cloud Builds
    needs:
      [
        detect-changes,
        build-processor,
        build-api,
        build-crawler,
        build-migrator,
        build-enrichment,
      ]
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Wait for builds to complete
        env:
          PROCESSOR_BUILD_ID: ${{ needs.build-processor.outputs.build_id }}
          API_BUILD_ID: ${{ needs.build-api.outputs.build_id }}
          CRAWLER_BUILD_ID: ${{ needs.build-crawler.outputs.build_id }}
          MIGRATOR_BUILD_ID: ${{ needs.build-migrator.outputs.build_id }}
          ENRICHMENT_BUILD_ID: ${{ needs.build-enrichment.outputs.build_id }}
        run: |
          echo "⏳ Waiting for Cloud Build jobs to complete..."
          echo ""

          # Store build IDs from submitted jobs
          SERVICES="${{ needs.detect-changes.outputs.services_to_build }}"

          if [ "$SERVICES" == "none" ]; then
            echo "ℹ️  No service rebuilds - skipping build wait"
            exit 0
          fi

          declare -a BUILD_IDS=()
          declare -a BUILD_NAMES=()

          add_build() {
            local id="$1"
            local name="$2"
            if [ -n "$id" ]; then
              BUILD_IDS+=("$id")
              BUILD_NAMES+=("$name")
            fi
          }

          add_build "$PROCESSOR_BUILD_ID" "processor"
          add_build "$API_BUILD_ID" "api"
          add_build "$CRAWLER_BUILD_ID" "crawler"
          add_build "$MIGRATOR_BUILD_ID" "migrator"
          add_build "$ENRICHMENT_BUILD_ID" "enrichment"

          TOTAL_BUILDS=${#BUILD_IDS[@]}
          if [ $TOTAL_BUILDS -eq 0 ]; then
            echo "ℹ️  No Cloud Build jobs were triggered in this workflow run."
            exit 0
          fi

          echo "Tracking $TOTAL_BUILDS build(s):"
          for idx in "${!BUILD_IDS[@]}"; do
            echo "  - ${BUILD_NAMES[$idx]} (${BUILD_IDS[$idx]})"
          done
          echo ""

          # Poll builds until completion
          MAX_WAIT=3600  # 60 minutes timeout
          ELAPSED=0
          POLL_INTERVAL=30

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STILL_RUNNING=0

            for idx in "${!BUILD_IDS[@]}"; do
              BUILD_ID=${BUILD_IDS[$idx]}
              SERVICE=${BUILD_NAMES[$idx]}
              STATUS=$(gcloud builds describe "$BUILD_ID" \
                --format='value(status)')

              case $STATUS in
                QUEUED|WORKING)
                  echo "⏳ [$SERVICE] Build $BUILD_ID still running (status: $STATUS)"
                  STILL_RUNNING=$((STILL_RUNNING + 1))
                  ;;
                SUCCESS)
                  echo "✅ [$SERVICE] Build $BUILD_ID completed successfully"
                  ;;
                FAILURE)
                  echo "❌ [$SERVICE] Build $BUILD_ID failed"
                  exit 1
                  ;;
                TIMEOUT)
                  echo "⏱️  [$SERVICE] Build $BUILD_ID timed out"
                  exit 1
                  ;;
                CANCELLED)
                  echo "⚠️  [$SERVICE] Build $BUILD_ID was cancelled"
                  exit 1
                  ;;
                *)
                  if [ -z "$STATUS" ]; then
                    echo "⚠️  [$SERVICE] Build $BUILD_ID status unavailable (possibly expired)"
                  else
                    echo "⚠️  [$SERVICE] Build $BUILD_ID status: $STATUS"
                  fi
                  ;;
              esac
            done

            if [ $STILL_RUNNING -eq 0 ]; then
              echo ""
              echo "✅ All tracked builds completed!"
              exit 0
            fi

            echo "  Waiting $POLL_INTERVAL seconds before next check... ($ELAPSED/$MAX_WAIT seconds elapsed)"
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "❌ Timeout waiting for builds (exceeded ${MAX_WAIT}s)"
          exit 1

  build-summary:
    name: Build Summary
    needs: [detect-changes, wait-for-builds]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report build status
        run: |
          echo "=== Build and Deploy Summary ==="
          echo "Services targeted: ${{ needs.detect-changes.outputs.services_to_build }}"

          if [ "${{ needs.detect-changes.outputs.services_to_build }}" == "none" ]; then
            echo "ℹ️  No service rebuilds detected (documentation/config-only changes)"
          else
            BUILD_RESULT="${{ needs.wait-for-builds.result }}"
            if [ "$BUILD_RESULT" == "success" ] || [ "$BUILD_RESULT" == "skipped" ]; then
              echo "✅ All Cloud Build jobs completed successfully"
              echo "🚀 Services deployed automatically via Cloud Build triggers"
              echo "   - Kubernetes deployments updated with new image tags"
              echo "   - Argo WorkflowTemplate updated with new image tags"
            else
              echo "❌ Build wait job failed (result: $BUILD_RESULT)"
              exit 1
            fi
          fi

  update-versions-env:
    name: Update versions.env
    # The build-* jobs must be listed here, not just reached transitively via
    # wait-for-builds: the `needs` context contains ONLY direct dependencies,
    # so `needs.build-crawler.outputs.build_id` resolved to empty and this job
    # reported success while updating nothing. k8s/versions.env consequently
    # went un-updated from 2026-04-03 until this fix, leaving the committed
    # tags months behind what is actually deployed.
    needs:
      [
        detect-changes,
        wait-for-builds,
        build-processor,
        build-api,
        build-crawler,
      ]
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        needs.build-processor.outputs.build_id != '' ||
        needs.build-api.outputs.build_id != '' ||
        needs.build-crawler.outputs.build_id != ''
      ) &&
      (needs.wait-for-builds.result == 'success' || needs.wait-for-builds.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare main branch
        run: |
          git checkout main
          git pull --ff-only origin main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update versions file
        env:
          SHORT_SHA: ${{ github.sha }}
          PROCESSOR_BUILD_ID: ${{ needs.build-processor.outputs.build_id }}
          API_BUILD_ID: ${{ needs.build-api.outputs.build_id }}
          CRAWLER_BUILD_ID: ${{ needs.build-crawler.outputs.build_id }}
          # Required by `gh pr create` below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=${SHORT_SHA:0:7}
          ARGS=()
          if [ -n "$PROCESSOR_BUILD_ID" ]; then ARGS+=(--processor "$SHORT"); fi
          if [ -n "$CRAWLER_BUILD_ID" ]; then ARGS+=(--crawler "$SHORT"); fi
          if [ -n "$API_BUILD_ID" ]; then ARGS+=(--api "$SHORT"); fi
          if [ ${#ARGS[@]} -eq 0 ]; then
            # This job's `if:` already established that at least one build ran,
            # so reaching here means the build IDs did not resolve -- the exact
            # silent no-op that left versions.env stale for ~4 months. Fail
            # loudly rather than report success while doing nothing.
            echo "::error::Build IDs did not resolve despite this job being" \
                 "triggered by a build. Check that every build-* job is listed" \
                 "in this job's needs: -- the needs context only exposes direct" \
                 "dependencies, so transitive access via wait-for-builds is empty."
            exit 1
          fi
          ./scripts/update-versions-env.sh "${ARGS[@]}"
          if git diff --quiet k8s/versions.env k8s/argo/base-pipeline-workflow.yaml; then
            echo "versions.env and Argo workflow already up to date"
            exit 0
          fi
          # A direct push to main is rejected by the repository ruleset
          # (GH013: "Repository rule violations found for refs/heads/main"),
          # so this job resolved the tags correctly and then failed at the very
          # last step -- leaving versions.env stale for a permissions reason
          # after the earlier logic bug was fixed. This repo lands changes by
          # PR, so open one.
          # One branch, not one per commit.
          #
          # This was chore/image-tags-${SHORT}, which opened a new PR every
          # deploy. Each was branched from main as it stood at the time, so
          # none contained any other's changes and all four rewrote the same
          # lines. By 2026-08-23 there were four open -- 8c60223, 86a73ec,
          # d2b5008, db99260 -- mutually conflicting, none of them current,
          # and versions.env on main a fortnight behind the cluster. The job
          # meant to prevent that drift was producing it.
          #
          # A fixed branch, rebuilt from main each run and force-pushed, means
          # exactly one open PR that always says what is deployed right now.
          BRANCH="chore/image-tags"
          git add k8s/versions.env k8s/argo/base-pipeline-workflow.yaml
          git commit -m "chore: update image tags (${SHORT}) [skip ci]"

          # Nothing here is under review: the images are already built and
          # rolled out, and these three strings only record which. Push it
          # straight to main when the ruleset allows this actor to. The PR
          # path below stays as the fallback, so a bypass that is absent or
          # later revoked degrades to a PR that merges itself rather than to
          # a job that stalls waiting for a human.
          if git push origin HEAD:main 2>/dev/null; then
            echo "Recorded the image tags directly on main."
            exit 0
          fi
          echo "Direct push refused by the branch ruleset; opening a PR instead."
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --title "chore: update image tags (${SHORT})" \
              --body "Automated by the update-versions-env job after a successful build of ${SHORT}. Records the image tags now deployed, so k8s/versions.env (used by envsubst for the manifests) and the repo Argo template match production. Bookkeeping only -- the images are already built and rolled out.

            This PR is rewritten by every deploy. Merging it records the tags as of that moment; leaving it open means the next deploy replaces its contents rather than opening a second one."
            echo "Updated the open PR for ${BRANCH}."
            gh pr merge "$BRANCH" --auto --squash 2>/dev/null \
              && echo "Auto-merge armed." \
              || echo "Auto-merge unavailable; the PR waits for a human."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update image tags (${SHORT})" \
              --body "Automated by the update-versions-env job after a successful build of ${SHORT}. Records the image tags now deployed, so k8s/versions.env (used by envsubst for the manifests) and the repo Argo template match production. Bookkeeping only -- the images are already built and rolled out.

            This PR is rewritten by every deploy. Merging it records the tags as of that moment; leaving it open means the next deploy replaces its contents rather than opening a second one."
          fi
