[pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py
asyncio_mode = strict
norecursedirs = tests/docker
; Coverage is not measured here. scripts/ci/test.sh measures the coverage
; suite and runs the floor (lnic_contracts.coverage_floor, one number for
; every repository); any other pytest invocation is a subset, and a
; subset's percentage is not the suite's.
addopts = -p no:postgresql -m "not integration and not e2e and not docker and not local_scripts"
markers =
	integration: marks tests that hit heavier workflows or external services
	requires_setup_logging: run tests with the real setup_logging implementation
	e2e: marks end-to-end pipeline smoke tests
	unit: marks pure unit tests that don't need database connections
	slow: marks tests that may hang or take excessive time (deselected by default)
	postgres: marks tests that require PostgreSQL database
	parallel: marks tests for parallel processing with row-level locking
	enable_selenium: allow tests to launch real Selenium/Chrome flows
	docker: marks tests that run in Docker containers (production readiness tests)
	work_queue: marks tests for work queue coordination
	proxy: marks tests for proxy routing and configuration
	local_scripts: marks tests for local development/diagnostic scripts (skipped in CI)
	allow_network: allow a test to make real outbound network connections (guard opt-out)
